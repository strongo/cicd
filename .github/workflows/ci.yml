name: Go CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Push events to semantic-version tags, i.e. v20.15.10
    paths:
      - '.github/workflows/**.yml'
      - '.gitignore'
      - 'src/**'
      - 'go.*'
      - '*.go'
      - 'action.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/**.yml'
      - '.gitignore'
      - 'src/**'
      - 'go.*'
      - '*.go'
      - 'action.yml'

jobs:

  release_calculator_regression:
    name: Release calculator regression
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      # The fixtures intentionally contain no package.json. They exercise the
      # same pinned action and runner-local configuration as the shared release
      # paths, including the v0 and no-release semantics that previously regressed.
      - name: Create release-calculator fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="${RUNNER_TEMP}/release-calculator-fixtures"
          mkdir -p "$fixture_root"

          make_fixture() {
            local name="$1"
            local message="$2"
            local tag="${3-v0.1.0}"
            local repository="$fixture_root/$name"
            git init --initial-branch=main "$repository"
            git -C "$repository" config user.email 'release-test@example.invalid'
            git -C "$repository" config user.name 'Release Test'
            git -C "$repository" commit --allow-empty -m 'chore: bootstrap'
            if [ -n "$tag" ]; then
              git -C "$repository" tag "$tag"
            fi
            git -C "$repository" commit --allow-empty -m "$message"
            test ! -e "$repository/package.json"
          }

          make_fixture v0-breaking 'feat!: change public API'
          make_fixture docs-only 'docs(cli): explain calculation'
          make_fixture prefixed-first 'fix: initial release' ''
          make_fixture shallow-source 'fix: release after a shallow checkout'

          # A real (non-squash) merge commit, shaped like the GitHub "Merge
          # pull request" commits release.yml's callers land day to day
          # (sneat-dev/wb#160): base tagged v0.1.0, a side branch carrying the
          # conventional commit, merged back with --no-ff so the merge
          # commit's own subject stays non-conventional and the introduced
          # commit is reachable from main only via the merge's second parent.
          make_merge_fixture() {
            local name="$1"
            local message="$2"
            local repository="$fixture_root/$name"
            git init --initial-branch=main "$repository"
            git -C "$repository" config user.email 'release-test@example.invalid'
            git -C "$repository" config user.name 'Release Test'
            git -C "$repository" commit --allow-empty -m 'chore: bootstrap'
            git -C "$repository" tag v0.1.0
            git -C "$repository" checkout -q -b side
            git -C "$repository" commit --allow-empty -m "$message"
            git -C "$repository" checkout -q main
            git -C "$repository" merge --no-ff -q -m "Merge pull request #1 from side" side
          }

          make_merge_fixture merge-feat 'feat(cli): add adopt command'
          make_merge_fixture merge-chore 'docs(cli): note the adopt command'

          git clone --depth 1 "file://${fixture_root}/shallow-source" "$fixture_root/shallow-clone"
          test "$(git -C "$fixture_root/shallow-clone" rev-parse --is-shallow-repository)" = 'true'
          test -z "$(git -C "$fixture_root/shallow-clone" tag --list 'v*')"

      - name: Assert shallow callers recover complete history and tags
        shell: bash
        run: |
          set -euo pipefail
          repository="${RUNNER_TEMP}/release-calculator-fixtures/shallow-clone"
          if [ "$(git -C "$repository" rev-parse --is-shallow-repository)" = "true" ]; then
            git -C "$repository" fetch --force --prune --tags --unshallow origin
          else
            git -C "$repository" fetch --force --prune --tags origin
          fi
          test "$(git -C "$repository" rev-parse --is-shallow-repository)" = 'false'
          test "$(git -C "$repository" tag --list 'v*' --sort=-v:refname | head -n 1)" = 'v0.1.0'

      - name: Prepare git-cliff configuration
        shell: bash
        run: |
          printf '%s\n' \
            '[bump]' \
            'initial_tag = "0.0.0"' \
            'features_always_bump_minor = true' \
            'breaking_always_bump_major = false' \
            '[git]' \
            'commit_parsers = [{ message = "^(chore|ci|docs|refactor)(\\(.+\\))?:", skip = true }]' \
            > "${RUNNER_TEMP}/cicd-git-cliff.toml"

          printf '%s\n' \
            '[bump]' \
            'initial_tag = "backend/v0.0.0"' \
            'features_always_bump_minor = true' \
            'breaking_always_bump_major = false' \
            '[git]' \
            'commit_parsers = [{ message = "^(chore|ci|docs|refactor)(\\(.+\\))?:", skip = true }]' \
            > "${RUNNER_TEMP}/cicd-git-cliff-prefixed.toml"

      - name: Compute a v0 breaking-change version
        id: v0_breaking
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.13.1
          config: ${{ runner.temp }}/cicd-git-cliff.toml
          args: >-
            --repository ${{ runner.temp }}/release-calculator-fixtures/v0-breaking
            --bumped-version
            --tag-pattern ^v[0-9]+\.[0-9]+\.[0-9]+$

      # git-cliff-action unpacks its binary into ./git-cliff/ inside the
      # caller's checkout and never removes it. Any later step that inspects
      # the worktree then sees an untracked directory: GoReleaser refuses
      # outright with "git is in a dirty state", failing the release before it
      # can tag anything. Three repositories hit this on the same day, each
      # looking like a local problem. A shared workflow must not leave build
      # artifacts in a consumer's worktree, so remove it as soon as the step
      # that created it is done.
      - name: Remove git-cliff working directory
        if: ${{ always() }}
        shell: bash
        run: rm -rf git-cliff

      - name: Assert v0 breaking-change behavior
        shell: bash
        env:
          ACTUAL: ${{ steps.v0_breaking.outputs.content }}
        run: test "$ACTUAL" = 'v0.2.0'

      - name: Compute a documentation-only version
        id: docs_only
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.13.1
          config: ${{ runner.temp }}/cicd-git-cliff.toml
          args: >-
            --repository ${{ runner.temp }}/release-calculator-fixtures/docs-only
            --bumped-version
            --tag-pattern ^v[0-9]+\.[0-9]+\.[0-9]+$

      # git-cliff-action unpacks its binary into ./git-cliff/ inside the
      # caller's checkout and never removes it. Any later step that inspects
      # the worktree then sees an untracked directory: GoReleaser refuses
      # outright with "git is in a dirty state", failing the release before it
      # can tag anything. Three repositories hit this on the same day, each
      # looking like a local problem. A shared workflow must not leave build
      # artifacts in a consumer's worktree, so remove it as soon as the step
      # that created it is done.
      - name: Remove git-cliff working directory
        if: ${{ always() }}
        shell: bash
        run: rm -rf git-cliff

      - name: Assert documentation-only behavior
        shell: bash
        env:
          ACTUAL: ${{ steps.docs_only.outputs.content }}
        run: test "$ACTUAL" = 'v0.1.0'

      # sneat-dev/wb#160: a real (non-squash) merge of PR #159 to sneat-dev/wb
      # (commit 298b9067c7686a4258b0e59d44d1db5a0e82d50e) landed a feat, the
      # shared release workflow ran and succeeded, and cut no tag. Against
      # that repository's actual ~320-commit/~100-tag history, git-cliff's
      # own auto-detected range for --bumped-version silently dropped the
      # commits the merge introduced and reported "nothing to bump" -- even
      # though `git-cliff --unreleased` (used to render the changelog body)
      # walked the same history and classified those same commits correctly.
      # The gap did not reproduce against small isolated fixtures of the same
      # merge topology (tried up to 30 synthetic prior releases), so it is
      # not pinned here as its own fixture -- it is undocumented git-cliff
      # behavior that appears tied to history scale/shape in ways this
      # module cannot cheaply reconstruct. What IS pinned below is the actual
      # fix release.yml now relies on unconditionally: an EXPLICIT
      # `<previous-tag>..HEAD` range, which computed the correct v0.47.0
      # against the real repository and is asserted here against the same
      # merge topology at fixture scale.
      - name: Compute a merge-introduced feature version with an explicit range
        id: merge_feat_explicit
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.13.1
          config: ${{ runner.temp }}/cicd-git-cliff.toml
          args: >-
            --repository ${{ runner.temp }}/release-calculator-fixtures/merge-feat
            --bumped-version
            --tag-pattern ^v[0-9]+\.[0-9]+\.[0-9]+$
            v0.1.0..HEAD

      - name: Remove git-cliff working directory
        if: ${{ always() }}
        shell: bash
        run: rm -rf git-cliff

      - name: Assert the explicit range correctly bumps a merge-introduced feature
        shell: bash
        env:
          ACTUAL: ${{ steps.merge_feat_explicit.outputs.content }}
        run: test "$ACTUAL" = 'v0.2.0'

      - name: Compute a merge-introduced chore-only version with an explicit range
        id: merge_chore_explicit
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.13.1
          config: ${{ runner.temp }}/cicd-git-cliff.toml
          args: >-
            --repository ${{ runner.temp }}/release-calculator-fixtures/merge-chore
            --bumped-version
            --tag-pattern ^v[0-9]+\.[0-9]+\.[0-9]+$
            v0.1.0..HEAD

      - name: Remove git-cliff working directory
        if: ${{ always() }}
        shell: bash
        run: rm -rf git-cliff

      - name: Assert a merge introducing only docs/chores still cuts nothing
        shell: bash
        env:
          ACTUAL: ${{ steps.merge_chore_explicit.outputs.content }}
        run: test "$ACTUAL" = 'v0.1.0'

      - name: Compute a first prefixed version
        id: prefixed_first
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.13.1
          config: ${{ runner.temp }}/cicd-git-cliff-prefixed.toml
          args: >-
            --repository ${{ runner.temp }}/release-calculator-fixtures/prefixed-first
            --bumped-version
            --tag-pattern ^backend/v[0-9]+\.[0-9]+\.[0-9]+$

      # git-cliff-action unpacks its binary into ./git-cliff/ inside the
      # caller's checkout and never removes it. Any later step that inspects
      # the worktree then sees an untracked directory: GoReleaser refuses
      # outright with "git is in a dirty state", failing the release before it
      # can tag anything. Three repositories hit this on the same day, each
      # looking like a local problem. A shared workflow must not leave build
      # artifacts in a consumer's worktree, so remove it as soon as the step
      # that created it is done.
      - name: Remove git-cliff working directory
        if: ${{ always() }}
        shell: bash
        run: rm -rf git-cliff

      - name: Assert prefixed initial-version behavior
        shell: bash
        env:
          ACTUAL: ${{ steps.prefixed_first.outputs.content }}
        # With no existing tags git-cliff returns initial_tag itself. The
        # resolver then applies default_bump when the caller requests one.
        run: test "$ACTUAL" = 'backend/v0.0.0'

      - name: Assert version resolution is monotonic
        shell: bash
        run: |
          set -euo pipefail
          version_is_greater() {
            local candidate="$1"
            local baseline="$2"
            [ "$candidate" != "$baseline" ] &&
              [ "$(printf '%s\n%s\n' "$baseline" "$candidate" | sort -V | tail -n 1)" = "$candidate" ]
          }

          if version_is_greater '0.1.2' '0.1.3'; then
            echo 'lower version was incorrectly accepted' >&2
            exit 1
          fi
          if version_is_greater '0.1.3' '0.1.3'; then
            echo 'equal version was incorrectly accepted' >&2
            exit 1
          fi
          version_is_greater '0.1.4' '0.1.3'
          version_is_greater '0.10.0' '0.9.9'

          previous_version='0.1.3'
          IFS=. read -r major minor patch <<< "$previous_version"
          fallback_version="$major.$minor.$((patch + 1))"
          test "$fallback_version" = '0.1.4'

  strongo_workflow:
    # The reusable workflow statically declares contents: write for its
    # version-bump job, even when bumping is disabled at runtime.
    permissions:
      contents: write
    uses: ./.github/workflows/workflow.yml
    with:
      # Exercise the scoped multi-owner path in both reusable-workflow jobs.
      # This repository has no dependencies, so the values only validate
      # configuration and cannot grant access to unrelated repositories.
      GOPRIVATE: github.com/strongo,github.com/bots-go-framework
      goprivate_git_hosts: |
        github.com/strongo
        github.com/bots-go-framework

    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  composite_action:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # PINNED TOGETHER WITH golangci-lint BELOW -- these two versions are
          # not independent. golangci-lint must be built with a Go at least as
          # new as the toolchain it analyses, or it cannot typecheck the
          # standard library ("unknown field rfd in struct literal of type
          # splicePipe" from internal/poll, on v2.12.2 against Go 1.27).
          #
          # Renovate raised this to 1.27 in 4576f10 on 2026-08-20. Combined
          # with golangci v2.13.0 landing the same morning, that turned the
          # whole Go fleet red. Back to 1.26, which is also what the consumer
          # modules actually declare (sneat-go go.mod: 1.26.1,
          # sneat-core-modules: 1.26) -- linting them under 1.27 was ahead of
          # the code being linted. Raise both versions together, deliberately.
          go-version: '1.27.0'
          cache: false

      - uses: ./
        with:
          github_token: ${{ github.token }}
          push_tag: 'false'
