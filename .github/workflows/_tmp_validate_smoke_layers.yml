name: TEMP validate smoke-test layers against known-bad specscore-cli v0.24.0

# THROWAWAY validation workflow. Not part of the shipped feature — deleted
# before this branch is merged. Exists only to prove, on a real GitHub-hosted
# macos-latest runner (never locally), that:
#   (a) layer 1 (run the raw release asset) PASSES for v0.24.0, as expected
#       (the raw binary is fine; the incident is install-path-specific), and
#   (b) layer 2 (codesign/spctl static assertion) FAILS for v0.24.0, as
#       expected (ad-hoc signature, no Developer ID), and
#   (c) layer 3 (brew install --cask + run) reproduces (or doesn't) the
#       actual Gatekeeper block on a headless GitHub Actions macOS runner —
#       the open residual-gap question from the incident review.
on:
  workflow_dispatch:
  push:
    branches:
      - agent/post-release-artifact-smoke

jobs:
  validate:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download the known-bad v0.24.0 darwin/arm64 release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/smoke"
          gh release download v0.24.0 --repo specscore/specscore-cli --pattern '*_darwin_arm64.*' --dir "${RUNNER_TEMP}/smoke" --clobber
          ls -la "${RUNNER_TEMP}/smoke"

      - name: Extract
        working-directory: ${{ runner.temp }}/smoke
        run: |
          set -euo pipefail
          tar xzf specscore_0.24.0_darwin_arm64.tar.gz
          chmod +x specscore
          ls -la

      - name: 'Layer 1 check: run raw asset (expect PASS)'
        working-directory: ${{ runner.temp }}/smoke
        run: |
          set -uo pipefail
          set +e
          run_with_timeout() {
            local seconds="$1"; shift
            "$@" &
            local cmd_pid=$!
            (
              sleep "$seconds"
              if kill -0 "$cmd_pid" 2>/dev/null; then
                touch .timed_out
                kill -TERM "$cmd_pid" 2>/dev/null
                sleep 2
                kill -KILL "$cmd_pid" 2>/dev/null
              fi
            ) &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }
          rm -f .timed_out
          output="$(run_with_timeout 30 ./specscore --version 2>&1)"
          status=$?
          echo "output=[$output] status=$status timed_out=$([ -f .timed_out ] && echo yes || echo no)"
          if [ -f .timed_out ]; then
            echo "RESULT: layer1=FAIL (timed out) -- UNEXPECTED, investigate"
          elif [ "$status" -ne 0 ]; then
            echo "RESULT: layer1=FAIL (exit $status) -- UNEXPECTED, investigate"
          else
            echo "RESULT: layer1=PASS (expected: raw asset runs fine)"
          fi

      - name: 'Layer 2 check: codesign/spctl (expect FAIL/rejected)'
        working-directory: ${{ runner.temp }}/smoke
        run: |
          set -uo pipefail
          set +e
          echo "=== codesign -dv --verbose=4 ==="
          codesign_out="$(codesign -dv --verbose=4 ./specscore 2>&1)"
          printf '%s\n' "$codesign_out"
          echo
          echo "=== spctl -a -vv ==="
          spctl_out="$(spctl -a -vv ./specscore 2>&1)"
          spctl_status=$?
          printf '%s\n' "$spctl_out"
          team_id="$(printf '%s\n' "$codesign_out" | grep '^TeamIdentifier=' | cut -d'=' -f2-)"
          echo "team_id=[${team_id:-not set}] spctl_status=$spctl_status"
          if { [ -z "$team_id" ] || [ "$team_id" = "not set" ]; } || [ "$spctl_status" -ne 0 ]; then
            echo "RESULT: layer2=DETECTED-BAD-SIGNING (expected: this is what would have caught v0.24.0)"
          else
            echo "RESULT: layer2=SIGNED-OK -- UNEXPECTED, investigate"
          fi

      - name: 'Layer 3 check: brew install --cask + run (open question)'
        run: |
          set -euo pipefail
          echo "Homebrew version: $(brew --version | head -1)"
          brew tap specscore/homebrew-tap
          brew install --cask specscore/homebrew-tap/specscore

      - name: 'Layer 3 check: run the Homebrew-installed binary under timeout'
        run: |
          set -uo pipefail
          set +e
          bin_path="$(brew --prefix)/bin/specscore"
          ls -la "$bin_path" || true
          xattr -l "$bin_path" || true
          run_with_timeout() {
            local seconds="$1"; shift
            "$@" &
            local cmd_pid=$!
            (
              sleep "$seconds"
              if kill -0 "$cmd_pid" 2>/dev/null; then
                touch "${RUNNER_TEMP}/.cask_timed_out"
                kill -TERM "$cmd_pid" 2>/dev/null
                sleep 2
                kill -KILL "$cmd_pid" 2>/dev/null
              fi
            ) &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }
          rm -f "${RUNNER_TEMP}/.cask_timed_out"
          start=$(date +%s)
          output="$(run_with_timeout 30 "$bin_path" --version 2>&1)"
          status=$?
          end=$(date +%s)
          echo "output=[$output] status=$status elapsed=$((end-start))s timed_out=$([ -f "${RUNNER_TEMP}/.cask_timed_out" ] && echo yes || echo no)"
          if [ -f "${RUNNER_TEMP}/.cask_timed_out" ]; then
            echo "RESULT: layer3=HUNG on GitHub-hosted macos-latest -- CONFIRMS the check catches this in CI, no residual gap for this runner type"
          elif [ "$status" -ne 0 ]; then
            echo "RESULT: layer3=FAILED (exit $status) on GitHub-hosted macos-latest -- also confirms a block, different symptom"
          else
            echo "RESULT: layer3=PASSED on GitHub-hosted macos-latest -- the block does NOT reproduce headlessly here; this IS a residual gap, document it"
          fi
