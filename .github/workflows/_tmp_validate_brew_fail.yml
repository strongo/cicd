name: TEMP validate brew-install-failure taxonomy (to be removed)

# THROWAWAY. Validates finding 3 directly: a brew install --cask failure
# (deliberately wrong cask name here) must warn and exit 0, never hard-fail
# the job, regardless of require_notarized_macos -- copied verbatim from
# the current release.yml brew_install step logic.
on:
  push:
    branches:
      - agent/post-release-artifact-smoke

jobs:
  brew_install_failure_path:
    runs-on: macos-latest
    env:
      HOMEBREW_TAP: specscore/homebrew-tap
      CASK_NAME: this-cask-does-not-exist-deliberately
    steps:
      - name: brew install --cask (the real user path)
        id: brew_install
        shell: bash
        run: |
          set -uo pipefail
          set +e

          run_with_timeout() {
            local seconds="$1"; shift
            "$@" &
            local cmd_pid=$!
            (
              sleep "$seconds"
              if kill -0 "$cmd_pid" 2>/dev/null; then
                touch "${RUNNER_TEMP}/.brew_install_timed_out"
                kill -TERM "$cmd_pid" 2>/dev/null
                sleep 2
                kill -KILL "$cmd_pid" 2>/dev/null
              fi
            ) &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }

          rm -f "${RUNNER_TEMP}/.brew_install_timed_out"
          echo "Tapping $HOMEBREW_TAP and installing --cask $HOMEBREW_TAP/$CASK_NAME (timeout 300s) -- deliberately wrong cask name"
          # shellcheck disable=SC2016
          run_with_timeout 300 bash -c 'set -e; brew tap "$HOMEBREW_TAP" && brew install --cask "$HOMEBREW_TAP/$CASK_NAME"'
          status=$?

          if [ -f "${RUNNER_TEMP}/.brew_install_timed_out" ]; then
            echo "::warning::Could not test: timed out"
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not test the Homebrew-cask install path: exited $status. This is NOT evidence the release is broken."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Assert this job SUCCEEDS despite the install failure
        run: |
          echo "installed=${{ steps.brew_install.outputs.installed }}"
          if [ "${{ steps.brew_install.outputs.installed }}" != "false" ]; then
            echo "RESULT: brew_install_failure_path=FAIL -- expected installed=false (cask name is deliberately wrong)"
            exit 1
          fi
          echo "RESULT: brew_install_failure_path=PASS -- brew_install step warned and exited 0; this job is GREEN despite the install failure, exactly as intended (finding 3 fix confirmed)"
