name: TEMP validate could-not-test taxonomy (to be removed)

# THROWAWAY validation workflow. Removed before this branch is finalized.
# Validates two things against the actual rewritten download/extract logic
# in release.yml (copy-pasted verbatim from the current file, not
# hand-approximated):
#   (a) the happy path still works after the review-2 rewrite (download,
#       extract, find the binary) against the real specscore-cli v0.24.0
#       linux/amd64 asset.
#   (b) a deliberately non-matching platform pattern is treated as "could
#       not test" -- warns and the JOB STILL SUCCEEDS (exit 0), rather than
#       hard-failing, which is the core fix from review round 2.
on:
  push:
    branches:
      - agent/post-release-artifact-smoke

jobs:
  happy_path:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v0.24.0
    steps:
      - name: Download published release asset
        id: download
        shell: bash
        run: |
          set -uo pipefail
          set +e

          run_with_timeout() {
            local seconds="$1"; shift
            "$@" &
            local cmd_pid=$!
            (
              sleep "$seconds"
              if kill -0 "$cmd_pid" 2>/dev/null; then
                touch "${RUNNER_TEMP}/.download_timed_out"
                kill -TERM "$cmd_pid" 2>/dev/null
                sleep 2
                kill -KILL "$cmd_pid" 2>/dev/null
              fi
            ) &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }

          mkdir -p "${RUNNER_TEMP}/artifact-smoke"
          rm -f "${RUNNER_TEMP}/.download_timed_out"
          goos="linux"
          goarch="amd64"
          echo "Downloading a ${goos}/${goarch} archive from specscore/specscore-cli@$TAG (timeout 120s)"
          run_with_timeout 120 gh release download "$TAG" --repo specscore/specscore-cli \
            --pattern "*_${goos}_${goarch}.tar.gz" \
            --pattern "*_${goos}_${goarch}.tgz" \
            --pattern "*_${goos}_${goarch}.zip" \
            --dir "${RUNNER_TEMP}/artifact-smoke" --clobber
          status=$?

          if [ -f "${RUNNER_TEMP}/.download_timed_out" ]; then
            echo "::warning::timed out"
            echo "asset_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::no match, status=$status"
            echo "asset_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ls -la "${RUNNER_TEMP}/artifact-smoke"
          echo "asset_found=true" >> "$GITHUB_OUTPUT"

      - name: Extract published archive
        id: extract
        if: ${{ steps.download.outputs.asset_found == 'true' }}
        shell: bash
        working-directory: ${{ runner.temp }}/artifact-smoke
        env:
          BINARY: specscore
        run: |
          set -uo pipefail
          set +e
          archive="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) | head -n1)"
          if [ -z "$archive" ]; then
            echo "::warning::no archive found"
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Testing artifact: $archive"
          extract_ok=true
          case "$archive" in
            *.zip) unzip -o -q "$archive" || extract_ok=false ;;
            *.tar.gz|*.tgz) tar xzf "$archive" || extract_ok=false ;;
          esac
          if [ "$extract_ok" = false ]; then
            echo "::warning::extract failed"
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bin_path=""
          if [ -n "$BINARY" ] && [ -f "$BINARY" ]; then
            bin_path="$BINARY"
          elif [ -n "$BINARY" ]; then
            bin_path="$(find . -maxdepth 3 -type f -name "$BINARY" | head -n1)"
          fi
          if [ -z "$bin_path" ] || [ ! -f "$bin_path" ]; then
            echo "::warning::binary not found"
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          chmod +x "$bin_path"
          {
            echo "archive=$archive"
            echo "bin_path=$bin_path"
            echo "extracted=true"
          } >> "$GITHUB_OUTPUT"

      - name: Assert happy path worked end to end
        run: |
          echo "asset_found=${{ steps.download.outputs.asset_found }}"
          echo "extracted=${{ steps.extract.outputs.extracted }}"
          echo "bin_path=${{ steps.extract.outputs.bin_path }}"
          if [ "${{ steps.download.outputs.asset_found }}" != "true" ] || [ "${{ steps.extract.outputs.extracted }}" != "true" ]; then
            echo "RESULT: happy_path=FAIL -- expected asset_found=true and extracted=true"
            exit 1
          fi
          "${{ runner.temp }}/artifact-smoke/${{ steps.extract.outputs.bin_path }}" --version
          echo "RESULT: happy_path=PASS"

  could_not_test_path:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v0.24.0
    steps:
      - name: Download published release asset (deliberately non-matching platform)
        id: download
        shell: bash
        run: |
          set -uo pipefail
          set +e

          run_with_timeout() {
            local seconds="$1"; shift
            "$@" &
            local cmd_pid=$!
            (
              sleep "$seconds"
              if kill -0 "$cmd_pid" 2>/dev/null; then
                touch "${RUNNER_TEMP}/.download_timed_out"
                kill -TERM "$cmd_pid" 2>/dev/null
                sleep 2
                kill -KILL "$cmd_pid" 2>/dev/null
              fi
            ) &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }

          mkdir -p "${RUNNER_TEMP}/artifact-smoke"
          rm -f "${RUNNER_TEMP}/.download_timed_out"
          goos="linux"
          goarch="riscv64"
          echo "Downloading a ${goos}/${goarch} archive from specscore/specscore-cli@$TAG (timeout 120s) -- deliberately does not exist"
          run_with_timeout 120 gh release download "$TAG" --repo specscore/specscore-cli \
            --pattern "*_${goos}_${goarch}.tar.gz" \
            --pattern "*_${goos}_${goarch}.tgz" \
            --pattern "*_${goos}_${goarch}.zip" \
            --dir "${RUNNER_TEMP}/artifact-smoke" --clobber
          status=$?

          if [ -f "${RUNNER_TEMP}/.download_timed_out" ]; then
            echo "::warning::Could not test ${goos}/${goarch}: timed out. This is NOT evidence the release is broken."
            echo "asset_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not test ${goos}/${goarch}: no release asset matched (status=$status). This is NOT evidence the release is broken -- it means this platform isn't testable by this check as configured."
            echo "asset_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "asset_found=true" >> "$GITHUB_OUTPUT"

      - name: Assert this job SUCCEEDS despite no matching asset
        run: |
          echo "asset_found=${{ steps.download.outputs.asset_found }}"
          if [ "${{ steps.download.outputs.asset_found }}" != "false" ]; then
            echo "RESULT: could_not_test_path=FAIL -- expected asset_found=false (riscv64 should not exist for specscore)"
            exit 1
          fi
          echo "RESULT: could_not_test_path=PASS -- download step warned and exited 0; this job is GREEN despite no matching asset, exactly as intended"
