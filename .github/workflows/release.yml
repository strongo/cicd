name: Release

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: false
        description: >-
          Token with read access to private Go modules. Used in the git URL
          username slot so GOPRIVATE fetches (e.g. GoReleaser's `go mod tidy`
          before-hook) can pull private dependencies. Only needed when GOPRIVATE
          is set; omit for repos with only public dependencies.
      GORELEASER_GITHUB_TOKEN:
        required: false
        description: >-
          Cross-repo PAT forwarded to GoReleaser as $GORELEASER_GITHUB_TOKEN.
          Used by publishers that push to OTHER repos the default GITHUB_TOKEN
          cannot reach — Homebrew tap/cask, Scoop bucket, and (unless a separate
          WINGET_GITHUB_TOKEN is given) the WinGet fork. Reference it in your
          `.goreleaser.yaml` as `{{ .Env.GORELEASER_GITHUB_TOKEN }}`. Omit for
          repos whose only "publisher" is the GitHub release itself.
      WINGET_GITHUB_TOKEN:
        required: false
        description: >-
          Optional PAT forwarded to GoReleaser as $WINGET_GITHUB_TOKEN, for the
          WinGet publisher's cross-fork PR to microsoft/winget-pkgs (needs a
          classic PAT with `public_repo`). Provide only if it must differ from
          GORELEASER_GITHUB_TOKEN; otherwise reference GORELEASER_GITHUB_TOKEN in
          the winget block instead.
      AUR_SSH_PRIVATE_KEY:
        required: false
        description: >-
          Optional AUR SSH private key, forwarded to GoReleaser as
          $AUR_SSH_PRIVATE_KEY. GoReleaser's `aurs` publisher accepts the key
          contents directly (`private_key: {{ .Env.AUR_SSH_PRIVATE_KEY }}`); the
          key must not be password-protected.
      MACOS_SIGN_P12:
        required: false
        description: >-
          Optional base64-encoded Apple Developer ID Application certificate
          (.p12), forwarded to GoReleaser as $MACOS_SIGN_P12. Pairs with
          MACOS_SIGN_PASSWORD. Referenced by a `notarize.macos[].sign` block
          as `{{ .Env.MACOS_SIGN_P12 }}`, typically gated
          `enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'` so the block is a
          no-op (unsigned binaries, same as today) until this secret is set.
          GoReleaser's notarize step is pure Go (quill) and runs on this same
          ubuntu job — no macOS runner needed. Omit for repos not yet signing
          macOS builds.
      MACOS_SIGN_PASSWORD:
        required: false
        description: >-
          Password for the MACOS_SIGN_P12 certificate, forwarded to
          GoReleaser as $MACOS_SIGN_PASSWORD. Required alongside
          MACOS_SIGN_P12 once that's set; otherwise unused.
      NOTARIZE_ISSUER_ID:
        required: false
        description: >-
          App Store Connect API issuer ID, forwarded to GoReleaser as
          $NOTARIZE_ISSUER_ID for the `notarize.macos[].notarize` block.
          Required alongside NOTARIZE_KEY_ID / NOTARIZE_KEY once
          MACOS_SIGN_P12 is set; otherwise unused.
      NOTARIZE_KEY_ID:
        required: false
        description: >-
          App Store Connect API key ID, forwarded to GoReleaser as
          $NOTARIZE_KEY_ID. See NOTARIZE_ISSUER_ID.
      NOTARIZE_KEY:
        required: false
        description: >-
          App Store Connect API private key (.p8 contents), forwarded to
          GoReleaser as $NOTARIZE_KEY. See NOTARIZE_ISSUER_ID.
    inputs:
      GOPRIVATE:
        type: string
        required: false
        default: ''
        description: >-
          Comma-separated private Go module path prefixes. Sets GOPRIVATE for go
          commands run during release (notably GoReleaser before-hooks). Leave
          empty for repos with only public dependencies.
      goprivate_git_host:
        type: string
        required: false
        default: 'github.com'
        description: >-
          Legacy single URL prefix authenticated with GH_TOKEN. Ignored when
          goprivate_git_hosts is set. Defaults to github.com for backward
          compatibility.
      goprivate_git_hosts:
        type: string
        required: false
        default: ''
        description: >-
          Comma- or newline-separated host/owner URL prefixes authenticated with
          GH_TOKEN, e.g. github.com/my-org,github.com/another-org. Each entry must
          include an owner; host-wide entries are rejected.
      go_version:
        type: string
        required: false
        default: '1.27.0'
        description: >-
          Go toolchain version for setup-go. Defaults to '1.27.0' -- matching
          workflow.yml's go_version input default, so CI proves a repo builds
          on the same toolchain the release job actually builds it with. (A
          mismatch previously here, '1.26' against workflow.yml's hardcoded
          '1.27.0', broke ingitdb-cli's release with "go.mod requires go >=
          1.27.0 (running go 1.26.5; GOTOOLCHAIN=local)".) Set to match your
          module's go.mod (e.g. '1.26.5') when a release needs a specific,
          older toolchain.
      goreleaser_extra_args:
        type: string
        required: false
        default: ''
        description: >-
          Extra arguments appended to `goreleaser release --clean`, e.g.
          `--skip=chocolatey,snapcraft` when those publishers run in a separate
          per-repo job (they need tooling/runners this ubuntu job lacks).
      tag_prefix:
        type: string
        required: false
        default: 'v'
        description: >-
          Prefix for version tags, e.g. "ingitdb/v" for a subdirectory module.
          Defaults to "v". Used when the CD bump path (branch/merge trigger)
          computes and pushes the next tag.
      default_bump:
        type: string
        required: false
        default: 'false'
        description: >-
          Bump level (conventional-commit semantics) applied on a CD run when NO
          conventional commit since the last tag implies one. Default 'false':
          docs/chore/ci-only merges cut no tag and publish nothing (GoReleaser is
          skipped). Set 'patch' to release on every merge to main.
      allow_major_version_bump:
        type: boolean
        required: false
        default: false
        description: >-
          When false (default), a CD run (branch/merge trigger) whose commits
          would bump the MAJOR version is CAPPED to a minor bump, and a warning
          is logged. This is the guard against an accidental v0->v1 (or vN->vN+1)
          jump from a `feat!:` / `BREAKING CHANGE:` commit — which
          conventional-commit parsing treats as a major bump regardless of any
          major_string_token sentinel. Pre-1.0, a breaking change is a minor
          bump; this preserves that. Set true only to intend a real major
          release (or push an explicit vX.0.0 tag, which bypasses the bump).
      artifact_smoke_test:
        type: boolean
        required: false
        default: true
        description: >-
          After GoReleaser publishes, verify the PUBLISHED artifacts actually
          run for a user — never a fresh local build, which would reproduce
          the exact blind spot that let a broken release ship (CI only ever
          tested source; nobody executed what got uploaded). Three layers,
          all gated by this one switch: (1) download the release asset per
          platform in artifact_smoke_test_platforms and run it under a
          timeout; (2) on macOS, statically assert the artifact is signed
          with a real Developer ID and notarized; (3) when this repo
          publishes a Homebrew cask (artifact_smoke_test_homebrew_cask),
          `brew install --cask` it and run the INSTALLED binary — the path a
          real user actually takes. Layers 2 and 3 exist because layer 1
          alone is insufficient: specscore-cli v0.24.0 shipped a Homebrew
          cask that macOS Gatekeeper silently blocked for every user
          (ad-hoc signature, no notarization) even though the raw downloaded
          binary ran fine standalone — a curl-and-run test alone would have
          passed this exact incident. See require_notarized_macos for layer
          2/3 severity.
          Every layer distinguishes "could not test" from "tested and
          broken": no matching release asset, an unrecognized archive, no
          binary found inside it, or a failed `brew install --cask` logs
          `::warning::` and is SKIPPED (not a failure) — this workflow is
          reused by repos not enumerated here, including libraries and
          Docker-only releases with no per-arch archive, and a naming/shape
          mismatch is not evidence of a broken release. Once the binary is
          actually found and executed, a hang / non-zero exit / empty output
          is ALWAYS a hard failure for layer 1 (unconditional — it passes
          today) and gated by require_notarized_macos for layers 2/3.
          Defaults to true deliberately — a default-off check would have
          caught nothing, and the could-not-test/tested-and-broken split
          above is what makes that default safe. Set false to opt out
          entirely for a repo that doesn't publish a runnable CLI binary.
      artifact_smoke_test_binary:
        type: string
        required: false
        default: ''
        description: >-
          Name of the published executable to smoke test. Empty (default)
          infers it, in order: (1) the first `builds[].binary` (falling back
          to `project_name`) read from the repo's own
          .goreleaser.{yaml,yml}/goreleaser.{yaml,yml} at the released tag;
          (2) if that file can't be read, the repo name with a trailing
          "-cli" stripped (specscore-cli -> specscore), or the org name for a
          repo literally named "cli" (chatwright/cli -> chatwright). Set this
          explicitly for a multi-binary repo (inference only checks the first
          build) or whenever the guess is wrong. EXCEPTION: if this repo's
          tag_prefix looks like a subdirectory-module path (e.g. "ingitdb/v")
          and no config was found at the repo root, step (2) is skipped —
          guessing from the repo name would likely name the wrong module —
          and the whole smoke test is skipped with a warning instead. Set
          this input explicitly to enable it for that case.
      artifact_smoke_test_command:
        type: string
        required: false
        default: '--version'
        description: >-
          Arguments passed to the published binary for the smoke test
          (layers 1 and 3), e.g. '--version'. The run must exit 0 and print
          non-empty output; once the binary is found, this is always a hard
          failure if it isn't (see artifact_smoke_test). Set this for a CLI
          whose default invocation doesn't support a bare `--version` (e.g.
          it prints usage and exits non-zero) — that's a real, if
          non-obvious, way to opt into a meaningful test rather than a false
          "broken" reading of a command this CLI never claimed to support.
      artifact_smoke_test_timeout_seconds:
        type: number
        required: false
        default: 30
        description: >-
          Seconds to wait for the binary to exit (layers 1 and 3) before
          killing it and failing/warning. Wrapped in an explicit watchdog
          (not the runner/job timeout) so a hang is reported as a clear
          smoke-test failure within this many seconds, never an eventual
          multi-hour job timeout — this is precisely the specscore-cli
          v0.24.0 failure mode as experienced by a user: Gatekeeper holding
          the process pending a code-signing assessment with no dialog to
          show on a headless runner (or, for the user, an assessment that
          silently never resolves).
      artifact_smoke_test_platforms:
        type: string
        required: false
        default: >-
          [{"runner":"ubuntu-latest","goos":"linux","goarch":"amd64"},{"runner":"macos-latest","goos":"darwin","goarch":"arm64"}]
        description: >-
          JSON array of {runner, goos, goarch} objects, one per platform
          layer 1 (and, on darwin, layer 2) smoke tests; consumed as a job
          matrix (`fromJson`). Defaults to linux/amd64 (ubuntu-latest) and
          darwin/arm64 (macos-latest, an Apple Silicon GitHub-hosted runner —
          the platform the specscore-cli v0.24.0 incident actually shipped
          on). For each platform, the release asset is matched by the
          GoReleaser-standard `*_<goos>_<goarch>.{tar.gz,tgz,zip}` filename
          (archive extensions only, so a checksum/signature/SBOM sidecar
          sharing the same os/arch-suffixed name is never mistaken for the
          real archive). No match is treated as "could not test" for that
          platform (a warning, not a failure) — see artifact_smoke_test.
          Override to add/remove platforms (e.g. windows) or trim to what
          this repo actually publishes.
      artifact_smoke_test_homebrew_cask:
        type: boolean
        required: false
        default: true
        description: >-
          Layer 3: when this repo's GoReleaser config publishes a
          `homebrew_casks:` entry (auto-detected from the same config layer
          1/2 read — no-ops otherwise), `brew install --cask` it on
          macos-latest and execute the INSTALLED binary under
          artifact_smoke_test_timeout_seconds. This is the path a real
          Homebrew user takes, and the only layer that reproduces Homebrew's
          quarantine attribute on the installed binary. A `brew tap`/`brew
          install` failure (transient Homebrew/network issue, tap-visibility
          timing, a cask-not-found mismatch) is "could not test" — a
          warning, not a failure, regardless of require_notarized_macos.
          Once installed, hang/non-zero-exit/empty-output severity follows
          require_notarized_macos, same as layer 2. KNOWN GAP, confirmed by
          actually running this against the quarantined specscore-cli
          v0.24.0 Homebrew-cask binary on a GitHub-hosted macos-latest
          runner: it does NOT reliably reproduce the real, indefinite
          Gatekeeper dialog a logged-in user hits (a headless runner has no
          session to render it) — that run completed after a ~30s
          assessment delay and exited 0. Treat this layer as corroborating;
          layer 2 is the reliable signal. Set false to skip this layer, e.g.
          to save the ~30-90s it costs while this repo's macOS build isn't
          notarized yet.
      require_notarized_macos:
        type: boolean
        required: false
        default: false
        description: >-
          Whether layers 2 and 3 (macOS code-signing/notarization) HARD FAIL
          the release. Default false: they still run every time and log a
          `::warning::` naming exactly what's missing (e.g. ad-hoc
          signature, `TeamIdentifier: not set`, spctl rejection) and what to
          do about it, but never block. This is a transitional default, NOT
          the intended end state — it's false only because, as of this
          input landing, nothing this org publishes is notarized yet, so a
          default hard-fail would red every release fleet-wide on day one
          and just get disabled by everyone instead of fixed. Flip to true
          per repo the moment its macOS build is actually signed with a
          Developer ID and notarized (needs a Developer ID Application
          certificate plus App Store Connect API credentials wired into the
          release job — see the "macOS notarization" section of this repo's
          README), to make that guarantee binding going forward.
    outputs:
      tag:
        description: >-
          The tag created by this workflow, or empty when no tag was cut (no
          bumping commits), the run was already on a tag with nothing to
          release, or require_notarized_macos is true and macOS verification
          of the published artifact failed (the release exists but was never
          promoted out of draft -- see macos_verify_and_promote). Consumers
          can chain per-repo publisher jobs on `needs.<job>.outputs.tag`
          exactly as before; this output is computed by finalize_release, not
          jobs.release directly, precisely so a chained publisher never fires
          against a tag whose release didn't actually go public.
        value: ${{ jobs.finalize_release.outputs.tag }}
#  push:
#    tags:
#      - 'v*.*.*'   # triggers only on tags like v1.26.0

jobs:
  release:
    name: GoReleaser
    # No upstream `needs` any more: this job now builds the matrix ONCE and
    # (when require_notarized_macos) publishes as a draft; macos_verify_and_
    # promote below verifies the real published bytes and gates PUBLIC
    # visibility, not this job's build. See the comment on that job.
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for GoReleaser to push GitHub releases
    outputs:
      tag: ${{ steps.tag.outputs.new_tag }}
      # JSON list of {owner, name, branch, pre_sha, post_sha} for each
      # git-hosted publisher repo (Homebrew tap/cask, Scoop bucket, Nix
      # repo) this run pushed to. Consumed by macos_verify_and_promote to
      # roll each one back to pre_sha if macOS verification fails. Empty
      # ('[]', or unset when the capture steps below were skipped) when
      # require_notarized_macos is false, no such publisher is configured,
      # or GoReleaser never actually ran (no tag cut this run).
      rollback_targets: ${{ steps.capture_post.outputs.rollback_targets }}

    steps:
      # 1. Checkout the code with full history + all tags. Both GoReleaser (changelog /
      #    "current tag" detection) and the version bump step (deriving the next version
      #    from commits since the last tag) fail or under-tag on the default shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go_version }}

      # A signing secret must never silently activate Quill in a release that
      # did not opt into the macOS verification-and-promotion gate below
      # (macos_verify_and_promote). Fail before any tag or release mutation
      # when the caller accidentally wires the secret without also setting
      # require_notarized_macos: true.
      - name: Guard signing secret policy before tagging
        shell: bash
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
        run: |
          set -euo pipefail
          if [ -n "$SIGN_P12" ] && [ "${{ inputs.require_notarized_macos }}" != "true" ]; then
            echo "::error::MACOS_SIGN_P12 is set but require_notarized_macos is false; refusing to tag or publish without the macOS verify-and-promote gate active. Set require_notarized_macos: true."
            exit 1
          fi

      # Authenticate private-module fetches (GoReleaser's `go mod tidy` hook runs
      # BEFORE the build and will fail to reach private deps otherwise). No-op for
      # repos that don't pass GOPRIVATE.
      - name: Set GitHub access token for GOPRIVATE
        if: ${{ inputs.GOPRIVATE }}
        shell: bash
        env:
          PRIVATE_GIT_TOKEN: ${{ secrets.GH_TOKEN }}
          PRIVATE_GIT_HOST: ${{ inputs.goprivate_git_host }}
          PRIVATE_GIT_HOSTS: ${{ inputs.goprivate_git_hosts }}
        run: |
          set -euo pipefail
          if [ -z "$PRIVATE_GIT_TOKEN" ]; then
            echo "::error title=Missing private-module token::GH_TOKEN is required when GOPRIVATE is set."
            exit 1
          fi
          prefixes="${PRIVATE_GIT_HOSTS:-$PRIVATE_GIT_HOST}"
          configured=0
          while IFS= read -r raw_prefix; do
            prefix="$(printf '%s' "$raw_prefix" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's:/*$::')"
            [ -z "$prefix" ] && continue
            if [ -n "$PRIVATE_GIT_HOSTS" ] && ! [[ "$prefix" =~ ^[A-Za-z0-9.-]+/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]; then
              echo "::error title=Invalid goprivate_git_hosts entry::'$prefix' must be a host/owner URL prefix such as github.com/my-org; host-wide credential rewrites are not allowed."
              exit 1
            fi
            git config --global "url.https://${PRIVATE_GIT_TOKEN}:x-oauth-basic@${prefix}/.insteadOf" "https://${prefix}/"
            configured=$((configured + 1))
          done < <(printf '%s\n' "$prefixes" | tr ',' '\n')
          if [ "$configured" -eq 0 ]; then
            echo "::error title=Missing GOPRIVATE Git prefix::Set goprivate_git_hosts or goprivate_git_host when GOPRIVATE is set."
            exit 1
          fi

      # Auto-bump only when the caller triggered on a branch push/merge. On a tag
      # push (github.ref_type == 'tag') the version is already fixed by the tag,
      # so skip the bump and release that exact tag as-is. This lets callers keep
      # an explicit "push a vX.Y.Z tag to release" flow while still sharing this
      # workflow — no auto-bump can override the tag they chose.
      #
      # git-cliff is language-neutral: it calculates a SemVer bump from Git
      # history and tags, without loading npm plugins or requiring package.json.
      # It does not create a release; the guarded git-tag step below remains the
      # sole publisher. Keep the config runner-local so consumers need no files.
      - name: Prepare git-cliff configuration
        if: ${{ github.ref_type != 'tag' }}
        env:
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          {
            printf '%s\n' '[bump]'
            printf 'initial_tag = "%s0.0.0"\n' "$PREFIX"
            printf '%s\n' \
              'features_always_bump_minor = true' \
              'breaking_always_bump_major = false' \
              '[git]' \
              'commit_parsers = [{ message = "^(chore|ci|docs|refactor)(\\(.+\\))?:", skip = true }]'
          } > "${RUNNER_TEMP}/cicd-git-cliff.toml"

      # Resolve the previous release tag once, before computing the bump, and
      # share it with both this step and the resolver below. git-cliff's own
      # tag auto-detection for `--bumped-version` has a gap: when a real
      # (non-squash) merge lands on main, the commits it introduces are
      # reachable from HEAD only through the merge commit's second parent,
      # and git-cliff's undirected auto-range silently drops them from the
      # bump calculation -- reporting no bump at all for a landed feat/fix --
      # even though `git-cliff --unreleased` (used to render the changelog
      # body) walks the same history and classifies those very commits
      # correctly. Empirically verified against sneat-dev/wb#160: commit
      # 298b9067c7686a4258b0e59d44d1db5a0e82d50e (a merge of a feat+fix PR)
      # computes "nothing to bump" with an auto-detected range, and the
      # correct v0.47.0 with an explicit `<previous-tag>..HEAD` range.
      # Passing that explicit range closes the gap; squash-merge and
      # direct-push landings are single-parent-only and unaffected either
      # way.
      # COLD START ("a repo with no prior tag can never release"): a repo
      # with NO matching tag anywhere in history used to
      # leave `range` empty here so git-cliff would fall back to processing
      # full history unranged. That fallback is the bug: git-cliff's
      # `--bumped-version` has no notion of "current version" without some
      # tag to diff against, and with an empty range it does not compute a
      # bump from the parsed commits at all -- it silently returns
      # [bump].initial_tag verbatim ("${PREFIX}0.0.0") EVEN WHEN THE HISTORY
      # CONTAINS feat:/fix: COMMITS. Empirically verified against a scratch
      # repo (see this PR's description for the four-case table) and against
      # the real incident: openvaultdb/ovdb had six feat: commits on main and
      # still proposed v0.0.0. "0.0.0" is then never greater than the
      # "0.0.0" baseline in "Resolve configured default bump" below, so a
      # never-tagged repo could never bootstrap its first release --
      # sneat-cli hit the same thing and both needed a hand-seeded tag.
      #
      # Fix: give git-cliff a real (but synthetic, local-only, NEVER pushed)
      # baseline tag to diff against, gated on the exact same
      # feat:/fix:-vs-chore:/ci:/docs:/refactor: classification every other
      # release uses -- see the "Resolve configured default bump" step,
      # unchanged, which still requires the resulting proposed version to be
      # numerically greater than 0.0.0 before it will cut a tag. A repo
      # whose entire history is chore:/ci:/docs:/refactor: (or has no
      # commits at all) still proposes 0.0.0 and still publishes nothing.
      #
      # The synthetic tag MUST be an ORPHAN commit -- NOT an ancestor of
      # HEAD -- rather than a tag on the actual first commit in history.
      # git-cliff's `<tag>..HEAD` range is EXCLUSIVE of the tagged commit
      # itself, so tagging the real first commit would silently drop that
      # exact commit from the bump calculation -- empirically reproduces the
      # identical "nothing to bump" bug for any repo whose very first commit
      # is itself a feat:. An orphan commit, unrelated to this branch's
      # history, excludes nothing: `git log <orphan>..HEAD` still walks
      # every real commit, while giving git-cliff the "0.0.0" baseline it
      # needs to compute an actual bump instead of parroting initial_tag
      # back. Tagged at the same version the git-cliff config's
      # [bump].initial_tag already declares, so a repo that legitimately has
      # no commits at all still resolves to "nothing to bump" (git-cliff
      # itself reports "next version is the same as the current version").
      # Deleted immediately after "Compute next version from Git history"
      # below (see "Remove synthetic cold-start baseline tag") so it never
      # reaches GoReleaser or the real tag-push step.
      - name: Resolve previous release tag
        id: previous_tag
        if: ${{ github.ref_type != 'tag' }}
        env:
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          latest_tag=""
          while IFS= read -r candidate_tag; do
            candidate_version="${candidate_tag#"$PREFIX"}"
            if [[ "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              latest_tag="$candidate_tag"
              break
            fi
          done < <(git tag --list "${PREFIX}*" --sort=-v:refname)
          previous_version="${latest_tag#"$PREFIX"}"
          if [ -z "$latest_tag" ] || ! [[ "$previous_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            previous_version="0.0.0"
            latest_tag=""
          fi
          cold_start="false"
          range=""
          if [ -n "$latest_tag" ]; then
            range="${latest_tag}..HEAD"
          else
            cold_start="true"
            empty_tree="$(git hash-object -t tree /dev/null)"
            synthetic_tag="${PREFIX}0.0.0"
            orphan_commit="$(GIT_AUTHOR_NAME=cicd-release-workflow GIT_AUTHOR_EMAIL=cicd-release-workflow@users.noreply.github.com GIT_COMMITTER_NAME=cicd-release-workflow GIT_COMMITTER_EMAIL=cicd-release-workflow@users.noreply.github.com git commit-tree "$empty_tree" -m "synthetic cold-start baseline (local-only, never pushed)")"
            git tag "$synthetic_tag" "$orphan_commit"
            range="${synthetic_tag}..HEAD"
          fi
          printf 'latest_tag=%s\nprevious_version=%s\nrange=%s\ncold_start=%s\n' "$latest_tag" "$previous_version" "$range" "$cold_start" >> "$GITHUB_OUTPUT"

      # The action prints the proposed tag (with the configured prefix) to its
      # `content` output; the resolver below converts it to bare SemVer.
      # A breaking change under v0 is a minor bump. We push with plain git so
      # the guard's decision is authoritative and the tag string is unambiguous.
      - name: Compute next version from Git history
        id: bump_dry
        if: ${{ github.ref_type != 'tag' }}
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.13.1
          config: ${{ runner.temp }}/cicd-git-cliff.toml
          args: >-
            --bumped-version
            --tag-pattern ^${{ inputs.tag_prefix }}[0-9]+\.[0-9]+\.[0-9]+$
            ${{ steps.previous_tag.outputs.range }}

      # git-cliff-action unpacks its binary into ./git-cliff/ inside the
      # caller's checkout and never removes it. Any later step that inspects
      # the worktree then sees an untracked directory: GoReleaser refuses
      # outright with "git is in a dirty state", failing the release before it
      # can tag anything. Three repositories hit this on the same day, each
      # looking like a local problem. A shared workflow must not leave build
      # artifacts in a consumer's worktree, so remove it as soon as the step
      # that created it is done.
      - name: Remove git-cliff working directory
        if: ${{ always() }}
        shell: bash
        run: rm -rf git-cliff

      # Cleans up the synthetic cold-start baseline tag created above (see
      # "Resolve previous release tag") before anything downstream -- most
      # importantly "Determine and push guarded tag" and GoReleaser itself --
      # can see it. It is local-only and was never pushed, but leaving it in
      # the checkout would still be a phantom "${PREFIX}0.0.0" tag sitting on
      # an orphan commit unrelated to this branch's history, and GoReleaser
      # generates its own changelog/tag listing independently of git-cliff --
      # no reason to risk it noticing a tag this workflow invented. `|| true`
      # because the step above already deletes nothing when cold_start is
      # false, and a tag that for any reason doesn't exist is not a failure
      # here.
      - name: Remove synthetic cold-start baseline tag
        if: ${{ always() && steps.previous_tag.outputs.cold_start == 'true' }}
        shell: bash
        env:
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          git tag -d "${PREFIX}0.0.0" || true

      # Preserve default_bump for callers that explicitly request a release.
      # previous_version/latest_tag come from the "Resolve previous release
      # tag" step above rather than being rescanned here, so the range fed to
      # git-cliff and the baseline this step compares against can never
      # disagree.
      #
      # SILENT-NOOP INCIDENT (three in one day: sneat-cli, datatug-cli,
      # openvaultdb/ovdb): the one exit 0 below that declines to cut a tag
      # used to do so with NO output and NO annotation -- a run that declined
      # was indistinguishable, from the run summary, from one that published
      # successfully; explaining any of the three required opening logs and
      # reconstructing PROPOSED_VERSION/LATEST_TAG/default_bump by hand. This
      # is the enforcement of sneat-co/backstage lesson
      # a-successful-release-run-must-not-hide-a-noop-publication (recurred
      # three times). Fix: an `::notice::` naming the proposed version, the
      # baseline it was compared against, the default_bump setting, and which
      # of those caused the decline, emitted right before that exit 0.
      # `::notice::` (not `::warning::`/`::error::`) because declining is the
      # CORRECT, unremarkable outcome for a no-op merge -- it must be
      # unmistakable, not alarming. GitHub surfaces every `::notice::`/
      # `::warning::`/`::error::` in the run's Annotations panel regardless
      # of which step emitted it, so this is visible on the run summary
      # without expanding a single step's logs. This is the ONLY exit 0 in
      # this step that both (a) is reached on the branch/merge trigger this
      # auto-bump logic exists for and (b) leaves new_version unset --
      # audited against every other `exit 0`/`exit 1` in this job (see the
      # git-cliff-based bump success path just above, which always sets
      # outputs, and the `default_bump` forced-bump path just below, which
      # cannot reach here and always sets outputs too).
      - name: Resolve configured default bump
        id: resolved_bump
        if: ${{ github.ref == 'refs/heads/main' && github.ref_type != 'tag' }}
        env:
          PROPOSED_VERSION: ${{ steps.bump_dry.outputs.content }}
          PREFIX: ${{ inputs.tag_prefix }}
          DEFAULT_BUMP: ${{ inputs.default_bump }}
          LATEST_TAG: ${{ steps.previous_tag.outputs.latest_tag }}
          PREVIOUS_VERSION: ${{ steps.previous_tag.outputs.previous_version }}
          COLD_START: ${{ steps.previous_tag.outputs.cold_start }}
        run: |
          set -euo pipefail
          version_is_greater() {
            local candidate="$1"
            local baseline="$2"
            [ "$candidate" != "$baseline" ] &&
              [ "$(printf '%s\n%s\n' "$baseline" "$candidate" | sort -V | tail -n 1)" = "$candidate" ]
          }
          latest_tag="$LATEST_TAG"
          previous_version="$PREVIOUS_VERSION"
          proposed_tag="$(printf '%s' "$PROPOSED_VERSION" | tr -d '\r\n')"
          next_version="${proposed_tag#"$PREFIX"}"
          if [[ "$next_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && version_is_greater "$next_version" "$previous_version"; then
            printf 'previous_version=%s\nnew_version=%s\nnew_tag=%s%s\nprevious_tag=%s\n' "$previous_version" "$next_version" "$PREFIX" "$next_version" "$latest_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DEFAULT_BUMP" = "false" ] || [ -z "$DEFAULT_BUMP" ]; then
            display_proposed="${proposed_tag:-<empty>}"
            display_default_bump="${DEFAULT_BUMP:-<empty>}"
            if [ "$COLD_START" = "true" ]; then
              baseline_label="no previous tag (this would have been the first release)"
              cause="no commit in this repo's entire history is a releasing type under the configured commit parsers (git-cliff proposed ${display_proposed}, i.e. no bump at all) -- only chore:/ci:/docs:/refactor: commits, or no commits, so there is nothing to bootstrap"
            else
              baseline_label="${latest_tag} (previous_version ${previous_version})"
              cause="no commit since ${latest_tag} is a releasing type under the configured commit parsers (git-cliff proposed ${display_proposed}, not greater than ${previous_version}) and default_bump is '${display_default_bump}', which does not force a release"
            fi
            echo "::notice title=No release published this run::Declining to cut a tag or run GoReleaser. Proposed version: ${display_proposed}. Baseline: ${baseline_label}. default_bump: '${display_default_bump}'. Reason: ${cause}. This is the expected outcome for a no-op merge, not a failure."
            exit 0
          fi
          case "$DEFAULT_BUMP" in patch|minor|major) ;; *) echo "Unsupported default_bump: $DEFAULT_BUMP" >&2; exit 1 ;; esac
          IFS=. read -r major minor patch <<< "$previous_version"
          case "$DEFAULT_BUMP" in
            patch) next_version="$major.$minor.$((patch + 1))" ;;
            minor) next_version="$major.$((minor + 1)).0" ;;
            major) next_version="$((major + 1)).0.0" ;;
          esac
          printf 'previous_version=%s\nnew_version=%s\nnew_tag=%s%s\nprevious_tag=%s\n' "$previous_version" "$next_version" "$PREFIX" "$next_version" "$latest_tag" >> "$GITHUB_OUTPUT"

      - name: Determine and push guarded tag
        id: tag
        if: ${{ github.ref == 'refs/heads/main' && github.ref_type != 'tag' && steps.resolved_bump.outputs.new_version != '' }}
        env:
          PREV: ${{ steps.resolved_bump.outputs.previous_version }}
          NEXT: ${{ steps.resolved_bump.outputs.new_version }}
          NEXT_TAG: ${{ steps.resolved_bump.outputs.new_tag }}
          PREV_TAG: ${{ steps.resolved_bump.outputs.previous_tag }}
          ALLOW_MAJOR: ${{ inputs.allow_major_version_bump }}
          PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          # previous_version / new_version are bare SemVer (no prefix).
          prev_major="${PREV%%.*}"
          next_major="${NEXT%%.*}"
          tag="$NEXT_TAG"
          if [ "$ALLOW_MAJOR" != "true" ] && [ -n "$PREV" ] && [ "$next_major" -gt "$prev_major" ]; then
            prev_minor="$(printf '%s' "$PREV" | cut -d. -f2)"
            capped="${prev_major}.$((prev_minor + 1)).0"
            tag="${PREFIX}${capped}"
            echo "::warning title=Major bump blocked::A breaking commit since ${PREV_TAG} would bump the MAJOR version (${PREV} -> ${NEXT}). Capping to ${capped} (pre-1.0 / disallowed-major semantics treat a breaking change as a minor bump). Set allow_major_version_bump: true, or push an explicit vX.0.0 tag, to intend a real major."
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "new_tag=$tag" >> "$GITHUB_OUTPUT"

      # Enumerates the git-hosted package-manager repos this release will
      # push to -- Homebrew tap/cask, Scoop bucket, Nix repo (via
      # GORELEASER_GITHUB_TOKEN over the GitHub API), and AUR (a plain git
      # repo at ssh://aur@aur.archlinux.org/<pkg>.git, over
      # AUR_SSH_PRIVATE_KEY) -- and captures each one's current HEAD SHA
      # BEFORE GoReleaser runs. macos_verify_and_promote below uses this to
      # roll each repo back to this exact commit if macOS verification
      # fails, restoring the old all-or-nothing release semantics instead of
      # leaving a formula/manifest/PKGBUILD live pointing at a release that
      # will never be promoted.
      #
      # WinGet and Chocolatey remain explicitly out of scope: WinGet opens a
      # cross-fork PR against the THIRD-PARTY microsoft/winget-pkgs repo --
      # not a publish, so there is nothing here to force-reset, and a human
      # closes the PR by hand (it would fail winget-pkgs' own validation
      # against a rolled-back release anyway); Chocolatey pushes a .nupkg
      # directly to chocolatey.org via API key, not to any git ref at all --
      # there is no commit to snapshot or restore. Both warn by name below
      # if configured, so the gap is visible rather than silent.
      #
      # Only runs when GoReleaser is actually about to run (same condition
      # as the step below): a no-op merge with no tag to cut has nothing to
      # capture.
      - name: Capture pre-release publisher repo SHAs
        id: capture_pre
        if: ${{ inputs.require_notarized_macos && (github.ref_type == 'tag' || steps.tag.outputs.new_tag != '') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          cat > "${RUNNER_TEMP}/capture_pre_release_shas.py" <<'PYEOF'
          import json
          import os
          import stat
          import subprocess

          config = {}
          for name in [".goreleaser.yaml", ".goreleaser.yml", "goreleaser.yaml", "goreleaser.yml"]:
              if os.path.isfile(name):
                  proc = subprocess.run(["yq", "-o=json", ".", name], capture_output=True, text=True)
                  if proc.returncode == 0 and proc.stdout.strip():
                      config = json.loads(proc.stdout)
                  break

          # Non-interactive, bounded SSH for every AUR git operation in this
          # workflow: BatchMode=yes and ConnectTimeout make a hung or
          # prompting SSH connection impossible on git's side; every
          # subprocess call below also passes an explicit `timeout=` so a
          # stalled network op cannot block this job on Python's side
          # either. accept-new (not full host-key pinning) trusts a
          # first-seen host key non-interactively -- simple, and consistent
          # with what a from-scratch CI runner can verify with no prior
          # state; not a materially weaker guarantee than what GoReleaser's
          # own aurs publisher already relies on to push today.
          def aur_ssh_env(key_path):
              env = dict(os.environ)
              env["GIT_SSH_COMMAND"] = (
                  "ssh -i " + key_path
                  + " -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10"
                  + " -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="
                  + os.path.join(os.path.dirname(key_path), "known_hosts")
              )
              return env

          def aur_head(git_url, env):
              try:
                  proc = subprocess.run(
                      ["git", "ls-remote", "--symref", git_url, "HEAD"],
                      capture_output=True, text=True, env=env, timeout=30,
                  )
              except subprocess.TimeoutExpired:
                  return None, None, "timed out reaching " + git_url
              if proc.returncode != 0:
                  return None, None, "git ls-remote failed: " + proc.stderr.strip()
              branch, sha = "", ""
              for line in proc.stdout.splitlines():
                  if line.startswith("ref: refs/heads/") and line.endswith("\tHEAD"):
                      branch = line[len("ref: refs/heads/"):-len("\tHEAD")]
                  elif line.endswith("\tHEAD"):
                      sha = line.split("\t", 1)[0]
              if not branch or not sha:
                  return None, None, "could not parse HEAD from ls-remote output"
              return branch, sha, None

          UNCOVERED = {
              "winget": "it opens a cross-fork PR against the THIRD-PARTY microsoft/winget-pkgs repo, not a publish -- nothing here to force-reset, and a human closes the PR by hand",
              "wingets": "it opens a cross-fork PR against the THIRD-PARTY microsoft/winget-pkgs repo, not a publish -- nothing here to force-reset, and a human closes the PR by hand",
              "chocolateys": "it pushes a .nupkg directly to chocolatey.org via API key, not to any git ref -- there is no commit to snapshot or restore at all",
          }
          for key, reason in UNCOVERED.items():
              if config.get(key):
                  print("::warning::This repo configures " + key + " in its GoReleaser config. Automatic rollback on a failed macOS verification does NOT cover it: " + reason + ". A verification failure will require manual cleanup of that publisher.")

          COVERED = ["brews", "homebrew_casks", "scoops", "nix"]
          targets = []
          seen = set()
          for key in COVERED:
              for entry in (config.get(key) or []):
                  repo = (entry or {}).get("repository") or {}
                  owner, name = repo.get("owner"), repo.get("name")
                  if not owner or not name:
                      continue
                  branch = repo.get("branch") or ""
                  ident = ("github", owner, name, branch)
                  if ident in seen:
                      continue
                  seen.add(ident)
                  targets.append({"kind": "github", "owner": owner, "name": name, "branch": branch})

          gh_token = os.environ.get("GH_TOKEN", "")
          resolved = []
          if targets and not gh_token:
              print("::warning::This repo configures Homebrew/Scoop/Nix publishers but GORELEASER_GITHUB_TOKEN is not set; automatic rollback cannot read or restore them on a failed verification.")
          else:
              for t in targets:
                  owner, name, branch = t["owner"], t["name"], t["branch"]
                  if not branch:
                      proc = subprocess.run(["gh", "api", "repos/" + owner + "/" + name, "--jq", ".default_branch"], capture_output=True, text=True)
                      branch = proc.stdout.strip()
                      if proc.returncode != 0 or not branch:
                          print("::warning::Could not resolve a branch for publisher repo " + owner + "/" + name + "; skipping rollback capture for it.")
                          continue
                  proc = subprocess.run(["gh", "api", "repos/" + owner + "/" + name + "/branches/" + branch, "--jq", ".commit.sha"], capture_output=True, text=True)
                  sha = proc.stdout.strip()
                  if proc.returncode != 0 or not sha:
                      print("::warning::Could not read the current HEAD of " + owner + "/" + name + "@" + branch + " (missing repo/branch, or GORELEASER_GITHUB_TOKEN lacks access); skipping rollback capture for it.")
                      continue
                  print("Captured pre-release SHA for " + owner + "/" + name + "@" + branch + ": " + sha)
                  resolved.append({"kind": "github", "owner": owner, "name": name, "branch": branch, "pre_sha": sha})

          aur_entries = config.get("aurs") or config.get("aur") or []
          aur_key = os.environ.get("AUR_SSH_PRIVATE_KEY", "")
          if aur_entries and not aur_key:
              print("::warning::This repo configures aurs but AUR_SSH_PRIVATE_KEY is not set; automatic rollback cannot read or restore its AUR package on a failed verification.")
          elif aur_entries:
              key_dir = os.path.join(os.environ.get("RUNNER_TEMP", "."), "aur-ssh")
              os.makedirs(key_dir, exist_ok=True)
              key_path = os.path.join(key_dir, "id_aur")
              with open(key_path, "w") as f:
                  f.write(aur_key if aur_key.endswith("\n") else aur_key + "\n")
              os.chmod(key_path, stat.S_IRUSR | stat.S_IWUSR)
              env = aur_ssh_env(key_path)
              seen_urls = set()
              for entry in aur_entries:
                  git_url = (entry or {}).get("git_url")
                  if not git_url or git_url in seen_urls:
                      continue
                  seen_urls.add(git_url)
                  branch, sha, error = aur_head(git_url, env)
                  if error:
                      print("::warning::Could not read the current HEAD of AUR repo " + git_url + " (" + error + "); skipping rollback capture for it.")
                      continue
                  print("Captured pre-release SHA for AUR " + git_url + "@" + branch + ": " + sha)
                  resolved.append({"kind": "aur", "git_url": git_url, "branch": branch, "pre_sha": sha})

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("targets=" + json.dumps(resolved) + "\n")
          PYEOF
          python3 "${RUNNER_TEMP}/capture_pre_release_shas.py"

      # The full-history checkout already fetched the remote tags, and a tag
      # created above is present in this checkout immediately. Do not fetch
      # again here: GoReleaser releases the local exact tag, while a redundant
      # network round-trip can fail after the immutable tag has already been
      # pushed and strand the release before publication.

      # Release the tag on HEAD: the exact tag on a tag-push, or the one the
      # guarded bump just cut on a branch/merge. On a branch/merge with no
      # bumping commit no tag was cut, so HEAD is untagged and there is nothing
      # to release — skip GoReleaser (running it on an untagged commit would
      # fail the job).
      - name: Run GoReleaser
        id: run_goreleaser
        if: ${{ github.ref_type == 'tag' || steps.tag.outputs.new_tag != '' }}
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pin the exact GoReleaser release whose embedded Quill module is
          # verified against the real published asset by
          # macos_verify_and_promote below.
          version: v2.18.0
          # --draft (a plain OSS CLI flag, overrides release.draft in the
          # consumer's .goreleaser.yaml -- no per-repo config change needed)
          # publishes this run's GitHub release as a draft ONLY when
          # require_notarized_macos is true: assets upload normally, but the
          # release is not listed and its assets are not served publicly
          # until macos_verify_and_promote below verifies them and promotes
          # it. When require_notarized_macos is false this is identical to
          # today: a normal, immediately-public release.
          args: >-
            release --clean
            ${{ inputs.require_notarized_macos && '--draft' || '' }}
            ${{ inputs.goreleaser_extra_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # required for releases
          GOPRIVATE: ${{ inputs.GOPRIVATE }}
          # Optional cross-repo publisher credentials. Empty when the caller
          # doesn't pass them; GoReleaser only reads the ones its config uses.
          GORELEASER_GITHUB_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          # Optional macOS signing + notarization (GoReleaser's `notarize`
          # publisher, pure Go via quill — runs fine on this ubuntu job, no
          # macOS runner needed). Empty when the caller doesn't pass them;
          # a `.goreleaser.yaml` `notarize.macos[].enabled` block should gate
          # itself on `{{ isEnvSet "MACOS_SIGN_P12" }}` so it's a no-op
          # (today's unsigned binaries, unchanged) until this is set. See
          # "macOS notarization" below.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
          NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
          NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}

      # Captures each rollback target's HEAD SHA again immediately AFTER
      # GoReleaser has pushed to it, so macos_verify_and_promote below can
      # tell -- via compare-and-swap against a repo re-read at rollback
      # time -- whether it is still safe to reset that repo to its
      # pre-release SHA, or whether someone else has pushed to it since (in
      # which case rollback must refuse, not clobber that push).
      #
      # Only runs once GoReleaser has actually succeeded: if it failed
      # partway through its own publish pipeline, that is an existing,
      # separate failure mode this change does not newly introduce (the
      # release job simply fails, exactly as before, and
      # macos_verify_and_promote's own `if` already requires the release job
      # to not have failed).
      - name: Capture post-release publisher repo SHAs
        id: capture_post
        if: ${{ inputs.require_notarized_macos && steps.run_goreleaser.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          PRE_TARGETS: ${{ steps.capture_pre.outputs.targets }}
        run: |
          cat > "${RUNNER_TEMP}/capture_post_release_shas.py" <<'PYEOF'
          import json
          import os
          import stat
          import subprocess

          def aur_ssh_env(key_path):
              env = dict(os.environ)
              env["GIT_SSH_COMMAND"] = (
                  "ssh -i " + key_path
                  + " -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10"
                  + " -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="
                  + os.path.join(os.path.dirname(key_path), "known_hosts")
              )
              return env

          def aur_head(git_url, env):
              try:
                  proc = subprocess.run(
                      ["git", "ls-remote", "--symref", git_url, "HEAD"],
                      capture_output=True, text=True, env=env, timeout=30,
                  )
              except subprocess.TimeoutExpired:
                  return None, "timed out reaching " + git_url
              if proc.returncode != 0:
                  return None, "git ls-remote failed: " + proc.stderr.strip()
              sha = ""
              for line in proc.stdout.splitlines():
                  if line.endswith("\tHEAD") and not line.startswith("ref: "):
                      sha = line.split("\t", 1)[0]
              if not sha:
                  return None, "could not parse HEAD from ls-remote output"
              return sha, None

          pre_targets = json.loads(os.environ.get("PRE_TARGETS") or "[]")
          gh_token = os.environ.get("GH_TOKEN", "")
          aur_key = os.environ.get("AUR_SSH_PRIVATE_KEY", "")
          aur_env = None
          if aur_key and any(t.get("kind") == "aur" for t in pre_targets):
              key_dir = os.path.join(os.environ.get("RUNNER_TEMP", "."), "aur-ssh")
              os.makedirs(key_dir, exist_ok=True)
              key_path = os.path.join(key_dir, "id_aur")
              with open(key_path, "w") as f:
                  f.write(aur_key if aur_key.endswith("\n") else aur_key + "\n")
              os.chmod(key_path, stat.S_IRUSR | stat.S_IWUSR)
              aur_env = aur_ssh_env(key_path)

          resolved = []
          for t in pre_targets:
              if t.get("kind") == "aur":
                  label = t["git_url"]
                  if not aur_env:
                      print("::warning::AUR_SSH_PRIVATE_KEY is not set; rollback will not be able to verify or restore " + label + " if the macOS check later fails.")
                      continue
                  sha, error = aur_head(t["git_url"], aur_env)
                  if error:
                      print("::warning::Could not read the post-release HEAD of AUR repo " + label + " right after GoReleaser ran (" + error + "); rollback will not be able to verify or restore it if the macOS check later fails.")
                      continue
              else:
                  owner, name, branch = t["owner"], t["name"], t["branch"]
                  label = owner + "/" + name + "@" + branch
                  if not gh_token:
                      continue
                  proc = subprocess.run(
                      ["gh", "api", "repos/" + owner + "/" + name + "/branches/" + branch, "--jq", ".commit.sha"],
                      capture_output=True, text=True,
                  )
                  sha = proc.stdout.strip()
                  if proc.returncode != 0 or not sha:
                      print("::warning::Could not read the post-release HEAD of " + label + " right after GoReleaser ran; rollback will not be able to verify or restore this repo if the macOS check later fails.")
                      continue
              print("Captured post-release SHA for " + label + ": " + sha)
              merged = dict(t)
              merged["post_sha"] = sha
              resolved.append(merged)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("rollback_targets=" + json.dumps(resolved) + "\n")
          PYEOF
          python3 "${RUNNER_TEMP}/capture_post_release_shas.py"

  # Verifies the darwin/arm64 artifact THIS RUN PUBLISHED, and gates its
  # public visibility on that verification. Replaces the old
  # macos_signing_preflight job, which built its own full binary matrix
  # SNAPSHOT on macos-latest before `release` below built the full matrix a
  # SECOND time on ubuntu-latest and published it -- two full matrix builds
  # per release, and the macOS job verified snapshot bytes that were never
  # the bytes actually published. See
  # https://github.com/strongo/cicd/issues/70.
  #
  # New shape: `release` (ubuntu-latest, below) builds the matrix ONCE,
  # signs and notarizes it -- GoReleaser's `notarize` publisher (quill) is
  # pure Go and needs no macOS runner -- and, only when
  # require_notarized_macos is true, publishes the GitHub release as a
  # DRAFT (`goreleaser release --draft`, a GoReleaser OSS CLI flag that
  # overrides `release.draft` in the consumer's .goreleaser.yaml with no
  # config change required in any of the 6 repos consuming this workflow).
  # macos_verify_and_promote (this job) then downloads the REAL published
  # darwin/arm64 asset from that draft release, runs the same three checks
  # the old preflight ran against a throwaway snapshot -- codesign --verify
  # --strict, spctl -a -t install asserting `source=Notarized Developer
  # ID`, and actually executing the binary -- and promotes the draft to a
  # public release ONLY on success (`gh release edit --draft=false`). A
  # verification failure leaves the release an unpromoted draft: GitHub
  # does not list a draft release or serve its assets to anyone without
  # write access to the repo, so nothing reaches a real user.
  #
  # KNOWN RESIDUAL RISK, mostly closed by the "Roll back publisher repos"
  # step at the end of this job: `goreleaser release --draft` still runs
  # this repo's Homebrew/Scoop/Nix/AUR/Chocolatey/WinGet publishers (when
  # configured) in the SAME invocation as the draft release, because
  # GoReleaser OSS has no supported way to build+sign+notarize+create-the-
  # release once and defer JUST those publishers to a later invocation
  # without rebuilding -- that split/merge (`release --split` + `continue`,
  # or `publish --merge`) is GoReleaser PRO-only (confirmed against the OSS
  # v2.18.0 source this workflow pins: its `cmd/` package has no `publish`
  # or `continue` subcommand at all; separately confirmed neither the brew,
  # cask, nor aur publisher pipes gate on `draft` -- only `skip_upload`).
  # So those publishers push formula/manifest/PKGBUILD updates pointing at
  # the draft release's asset URLs before this job has verified anything.
  # Consequences, and what is and isn't covered:
  #
  # (1) A brief window (this job's runtime, typically a few minutes) where
  #     a freshly-tapped/pushed formula 404s until promotion -- narrow, not
  #     destructive (it self-heals the moment "Promote draft release to
  #     public" below succeeds), and no worse than the tap-visibility-timing
  #     gaps this workflow already treats as "could not test, not broken"
  #     elsewhere (see artifact_smoke_test_homebrew_cask below). No rollback
  #     mechanism can shrink this window without GoReleaser Pro's
  #     split/merge; it is accepted as-is.
  #
  # (2) If verification then FAILS, "Roll back publisher repos and delete
  #     the draft release" below restores every publisher that pushes to a
  #     git ref this workflow can reach -- Homebrew (brews/homebrew_casks),
  #     Scoop, and Nix over the GitHub API (GORELEASER_GITHUB_TOKEN), and
  #     AUR over SSH (AUR_SSH_PRIVATE_KEY, a plain `git push --force` to
  #     ssh://aur@aur.archlinux.org/<pkg>.git) -- to its pre-release commit.
  #     Every restore is compare-and-swap guarded: it refuses to touch a
  #     repo that has been pushed to again since GoReleaser's push, naming
  #     both SHAs instead of clobbering that push. It also deletes the
  #     unpromoted draft release. This recovers the old preflight's
  #     all-or-nothing guarantee for all four publisher kinds.
  #
  #     COVERED BY ROLLBACK: brews, homebrew_casks, scoops, nix, aurs.
  #     NOT COVERED, genuinely unrecoverable by this mechanism: WinGet
  #     (opens a cross-fork PR against the THIRD-PARTY microsoft/winget-pkgs
  #     repo -- not a publish, so there is nothing to force-reset; a human
  #     closes the PR by hand, and it would fail winget-pkgs' own validation
  #     against a rolled-back release anyway) and Chocolatey (pushes a
  #     .nupkg directly to chocolatey.org via API key, not to any git ref --
  #     there is no commit to snapshot or restore at all). A failure while
  #     either is configured still needs manual cleanup; the capture step
  #     below emits an explicit `::warning::` naming which one and why.
  #     ingitdb-cli is the one current consumer configuring WinGet (and the
  #     only one configuring AUR, which IS now covered).
  macos_verify_and_promote:
    name: Verify and promote macOS release
    needs: release
    if: ${{ inputs.require_notarized_macos && !failure() && !cancelled() && (needs.release.outputs.tag != '' || github.ref_type == 'tag') }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write   # gh release edit --draft=false promotes the release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SMOKE_CMD: ${{ inputs.artifact_smoke_test_command }}
      TIMEOUT_SECONDS: ${{ inputs.artifact_smoke_test_timeout_seconds }}

    steps:
      # Same tag-resolution contract as resolve_artifact_smoke_test below:
      # `release`'s own tag output is empty on a direct tag push (the bump
      # step that sets it only runs on a branch/merge trigger), so fall
      # back to the ref name in that case.
      - name: Determine the tag this run published
        id: release_tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [ -z "$tag" ] && tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Sparse, ref-pinned checkout of just the GoReleaser config as it
      # existed at the exact tag just published. This job resolves its own
      # binary name independently (duplicated from resolve_artifact_smoke_test
      # below) rather than depending on that job, so require_notarized_macos
      # keeps gating publication even when a caller sets
      # artifact_smoke_test: false.
      - name: Checkout GoReleaser config at the published tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          sparse-checkout: |
            .goreleaser.yaml
            .goreleaser.yml
            goreleaser.yaml
            goreleaser.yml
          sparse-checkout-cone-mode: false

      - name: Resolve darwin/arm64 binary name
        id: resolve_binary
        env:
          BINARY_OVERRIDE: ${{ inputs.artifact_smoke_test_binary }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          config_file=""
          for f in .goreleaser.yaml .goreleaser.yml goreleaser.yaml goreleaser.yml; do
            if [ -f "$f" ]; then config_file="$f"; break; fi
          done

          binary="$BINARY_OVERRIDE"
          if [ -n "$config_file" ] && command -v yq >/dev/null 2>&1; then
            if [ -z "$binary" ]; then
              binary="$(yq -r '.builds[0].binary // ""' "$config_file")"
              [ "$binary" = "null" ] && binary=""
              if [ -z "$binary" ]; then
                binary="$(yq -r '.project_name // ""' "$config_file")"
                [ "$binary" = "null" ] && binary=""
              fi
            fi
          fi
          if [ -z "$binary" ]; then
            case "$TAG_PREFIX" in
              */*)
                echo "::error::Cannot resolve a darwin/arm64 binary to verify for subdirectory-module tag_prefix '$TAG_PREFIX'; set artifact_smoke_test_binary explicitly. require_notarized_macos cannot be enforced without it, and the release stays an unpromoted draft."
                exit 1
                ;;
              *)
                repo_name="${GITHUB_REPOSITORY#*/}"
                org_name="${GITHUB_REPOSITORY%%/*}"
                if [ "$repo_name" = "cli" ]; then
                  binary="$org_name"
                else
                  binary="${repo_name%-cli}"
                fi
                ;;
            esac
          fi
          echo "Resolved binary: $binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      # Same asset-selection contract as the post-publish smoke test job
      # below: only a real archive ("*_darwin_arm64.{tar.gz,tgz,zip}"), never
      # a sidecar that happens to share the arch-suffixed name. Unlike that
      # job, a miss here is a hard failure, not a warning: this job is the
      # ONLY thing gating require_notarized_macos, so "could not verify" must
      # not be silently treated the same as "verified fine" -- it must block
      # promotion exactly like a real signing failure would.
      - name: Download the published darwin/arm64 asset
        id: download
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -uo pipefail
          set +e
          mkdir -p "${RUNNER_TEMP}/macos-verify"
          echo "Downloading darwin/arm64 archive from $GITHUB_REPOSITORY@$TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*_darwin_arm64.tar.gz" \
            --pattern "*_darwin_arm64.tgz" \
            --pattern "*_darwin_arm64.zip" \
            --dir "${RUNNER_TEMP}/macos-verify" --clobber
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::require_notarized_macos=true but no darwin/arm64 release asset matched '*_darwin_arm64.{tar.gz,tgz,zip}' for tag $TAG on the just-published draft release. Cannot verify what this check cannot find, so refusing to promote -- the release stays an unpromoted draft. Common cause: this repo's archive naming differs from GoReleaser's default '<name>_<version>_<os>_<arch>' convention."
            exit 1
          fi
          ls -la "${RUNNER_TEMP}/macos-verify"

      - name: Extract archive for macOS verification
        id: extract
        shell: bash
        working-directory: ${{ runner.temp }}/macos-verify
        env:
          BINARY: ${{ steps.resolve_binary.outputs.binary }}
        run: |
          set -euo pipefail
          archive="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) | head -n1)"
          if [ -z "$archive" ]; then
            echo "::error::Downloaded darwin/arm64 asset(s) matched by name but none was a recognizable archive (.tar.gz/.tgz/.zip). Refusing to promote."
            exit 1
          fi
          echo "Verifying artifact: $archive"
          case "$archive" in
            *.zip) unzip -o -q "$archive" ;;
            *.tar.gz|*.tgz) tar xzf "$archive" ;;
          esac
          bin_path="$(find . -maxdepth 3 -type f -name "$BINARY" | head -n1)"
          if [ -z "$bin_path" ]; then
            echo "::error::Extracted '$archive' but found no '$BINARY' executable inside it. Refusing to promote. Set artifact_smoke_test_binary explicitly if the resolved name is wrong."
            exit 1
          fi
          bin_path="$(cd "$(dirname "$bin_path")" && pwd -P)/$(basename "$bin_path")"
          chmod +x "$bin_path"
          echo "bin_path=$bin_path" >> "$GITHUB_OUTPUT"

      # Identical assertions to the removed macos_signing_preflight job, now
      # run against the exact published bytes instead of a discarded
      # snapshot. See the Layer 2 smoke-test step further below for the full
      # incident history behind the codesign/spctl reasoning duplicated here
      # (GitHub Actions has no mechanism to share logic across jobs).
      - name: Verify signature, notarization, and execution
        shell: bash
        env:
          BIN_PATH: ${{ steps.extract.outputs.bin_path }}
        run: |
          set -uo pipefail
          set +e
          codesign_output="$(codesign --verify --deep --strict --verbose=4 "$BIN_PATH" 2>&1)"
          codesign_status=$?
          printf '%s\n' "$codesign_output"
          if [ "$codesign_status" -ne 0 ]; then
            echo "::error::Published darwin/arm64 artifact has an invalid code signature (codesign exited $codesign_status). Refusing to promote."
            exit 1
          fi

          spctl_output="$(spctl -a -t install -vv "$BIN_PATH" 2>&1)"
          spctl_status=$?
          printf '%s\n' "$spctl_output"
          # spctl -t install can exit 0 for a Developer-ID-signed-but-never-
          # notarized binary, so exit code alone is not sufficient -- the
          # string match is the real notarization assertion. See the Layer 2
          # smoke-test step below for the incident (specscore-cli v0.24.0)
          # that made this the required check rather than a bare exit-code
          # check.
          if [ "$spctl_status" -ne 0 ] || ! printf '%s\n' "$spctl_output" | grep -q 'source=Notarized Developer ID'; then
            echo "::error::Published darwin/arm64 artifact was not accepted as source=Notarized Developer ID. Refusing to promote."
            exit 1
          fi

          run_with_timeout() {
            local seconds="$1"; shift
            process_group_exists() {
              python3 -c 'import os, sys; os.killpg(int(sys.argv[1]), 0)' "$1" 2>/dev/null
            }
            set -m
            "$@" &
            local cmd_pid=$!
            set +m
            python3 -c '
          import os
          import signal
          import sys
          import time

          seconds = float(sys.argv[1])
          pgid = int(sys.argv[2])
          marker = sys.argv[3]
          time.sleep(seconds)
          try:
              os.killpg(pgid, 0)
          except ProcessLookupError:
              sys.exit(0)
          open(marker, "a").close()
          os.killpg(pgid, signal.SIGTERM)
          time.sleep(2)
          try:
              os.killpg(pgid, signal.SIGKILL)
          except ProcessLookupError:
              pass
          ' "$seconds" "$cmd_pid" "${RUNNER_TEMP}/.macos_verify_timed_out" >/dev/null 2>&1 &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            if process_group_exists "$cmd_pid"; then
              kill -TERM -- "-$cmd_pid" 2>/dev/null
              local deadline=$((SECONDS + 2))
              while process_group_exists "$cmd_pid" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.05
              done
              if process_group_exists "$cmd_pid"; then
                kill -KILL -- "-$cmd_pid" 2>/dev/null
              fi
            fi
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }

          rm -f "${RUNNER_TEMP}/.macos_verify_timed_out"
          # SMOKE_CMD is deliberately unquoted, same as every other smoke-test
          # step in this file.
          # shellcheck disable=SC2086
          output="$(run_with_timeout "$TIMEOUT_SECONDS" "$BIN_PATH" $SMOKE_CMD 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ -f "${RUNNER_TEMP}/.macos_verify_timed_out" ]; then
            echo "::error::Published darwin/arm64 artifact exceeded ${TIMEOUT_SECONDS}s and was killed. Refusing to promote."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::Published darwin/arm64 artifact exited $status running '$BIN_PATH $SMOKE_CMD'. Refusing to promote."
            exit 1
          fi
          if [ -z "$(printf '%s' "$output" | tr -d '[:space:]')" ]; then
            echo "::error::Published darwin/arm64 artifact exited 0 but produced no output running '$BIN_PATH $SMOKE_CMD'. Refusing to promote."
            exit 1
          fi
          echo "OK: published darwin/arm64 artifact is signed, notarized, runnable, and produced output."

      # Only reached if every check above passed. Promotion is the sole gate
      # on public visibility: assets were already uploaded when `release`
      # ran GoReleaser above, but a draft release is not listed and its
      # assets are not served to anyone without write access to this repo.
      - name: Promote draft release to public
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Promoted $GITHUB_REPOSITORY@$TAG from draft to public."

      # Runs ONLY when a step above in this job failed (codesign, spctl,
      # execution, or the darwin/arm64 asset never being found/downloaded).
      # Restores the old all-or-nothing release semantics that the removed
      # macos_signing_preflight job provided for free (a failed preflight
      # blocked the tag, the release, AND every publisher from running at
      # all): rolls each publisher repo GoReleaser just pushed to back to
      # its pre-release commit -- GitHub-hosted (Homebrew/Scoop/Nix) via
      # the GitHub API, AUR over SSH via a plain force-push -- and deletes
      # the unpromoted draft release so neither an orphan draft nor a stale
      # formula/manifest/PKGBUILD is left behind pointing at a release that
      # will never go public.
      #
      # Best-effort and loud, by design: every target is attempted
      # independently even if an earlier one fails, and this step always
      # ends by naming exactly which repos were and were not restored --
      # never silently. A rollback failure here does not, and cannot, mask
      # the ORIGINAL verification failure above (this step's own outcome
      # does not change the job's already-`failure` conclusion); it is
      # reported as its own, separate `::error::`.
      #
      # Safety: only resets a repo if its CURRENT head, re-read right now,
      # still matches the SHA GoReleaser's push produced (captured
      # immediately after "Run GoReleaser" succeeded, in the `release` job
      # above, by capture_post). If anything else has pushed to that
      # repo/branch since, that is a real concurrent write and
      # force-resetting would destroy it -- so this refuses to touch that
      # repo, names both SHAs, and requires a human to reconcile it by hand
      # instead. Every SSH call carries its own timeout, and SSH itself
      # runs BatchMode + ConnectTimeout, so this step cannot hang waiting on
      # a prompt or a stalled connection.
      - name: Roll back publisher repos and delete the draft release
        if: failure()
        shell: bash
        env:
          RELEASE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GH_TOKEN: ${{ secrets.GORELEASER_GITHUB_TOKEN }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          ROLLBACK_TARGETS: ${{ needs.release.outputs.rollback_targets }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          cat > "${RUNNER_TEMP}/rollback.py" <<'PYEOF'
          import json
          import os
          import stat
          import subprocess
          import sys
          import tempfile

          def aur_ssh_env(key_path):
              env = dict(os.environ)
              env["GIT_SSH_COMMAND"] = (
                  "ssh -i " + key_path
                  + " -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10"
                  + " -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="
                  + os.path.join(os.path.dirname(key_path), "known_hosts")
              )
              return env

          def aur_head(git_url, env):
              try:
                  proc = subprocess.run(
                      ["git", "ls-remote", "--symref", git_url, "HEAD"],
                      capture_output=True, text=True, env=env, timeout=30,
                  )
              except subprocess.TimeoutExpired:
                  return None, "timed out reaching " + git_url
              if proc.returncode != 0:
                  return None, "git ls-remote failed: " + proc.stderr.strip()
              sha = ""
              for line in proc.stdout.splitlines():
                  if line.endswith("\tHEAD") and not line.startswith("ref: "):
                      sha = line.split("\t", 1)[0]
              if not sha:
                  return None, "could not parse HEAD from ls-remote output"
              return sha, None

          def aur_force_push(git_url, branch, pre_sha, env):
              with tempfile.TemporaryDirectory() as tmpdir:
                  try:
                      clone = subprocess.run(
                          ["git", "clone", "--bare", "--quiet", git_url, tmpdir],
                          capture_output=True, text=True, env=env, timeout=60,
                      )
                  except subprocess.TimeoutExpired:
                      return "timed out cloning " + git_url
                  if clone.returncode != 0:
                      return "git clone failed: " + clone.stderr.strip()
                  try:
                      push = subprocess.run(
                          ["git", "push", "--force", git_url, pre_sha + ":refs/heads/" + branch],
                          capture_output=True, text=True, env=env, cwd=tmpdir, timeout=60,
                      )
                  except subprocess.TimeoutExpired:
                      return "timed out force-pushing to " + git_url
                  if push.returncode != 0:
                      return "git push --force failed: " + push.stderr.strip()
              return None

          tap_token = os.environ.get("TAP_GH_TOKEN", "")
          tap_env = None
          if tap_token:
              tap_env = dict(os.environ)
              tap_env["GH_TOKEN"] = tap_token

          aur_key = os.environ.get("AUR_SSH_PRIVATE_KEY", "")
          targets = json.loads(os.environ.get("ROLLBACK_TARGETS") or "[]")
          aur_env = None
          if aur_key and any(t.get("kind") == "aur" for t in targets):
              key_dir = os.path.join(os.environ.get("RUNNER_TEMP", "."), "aur-ssh-rollback")
              os.makedirs(key_dir, exist_ok=True)
              key_path = os.path.join(key_dir, "id_aur")
              with open(key_path, "w") as f:
                  f.write(aur_key if aur_key.endswith("\n") else aur_key + "\n")
              os.chmod(key_path, stat.S_IRUSR | stat.S_IWUSR)
              aur_env = aur_ssh_env(key_path)

          restored = []
          refused = []
          errored = []

          for t in targets:
              kind = t.get("kind", "github")
              label = t["git_url"] if kind == "aur" else t["owner"] + "/" + t["name"] + "@" + t["branch"]
              pre_sha, post_sha = t.get("pre_sha"), t.get("post_sha")
              if not pre_sha or not post_sha:
                  print("::error::No pre/post SHA recorded for " + label + "; cannot safely restore it. Check it by hand.")
                  errored.append(label)
                  continue

              if kind == "aur":
                  if not aur_env:
                      print("::error::AUR_SSH_PRIVATE_KEY is not set; cannot verify or restore " + label + ". Restore it by hand.")
                      errored.append(label)
                      continue
                  current_sha, error = aur_head(t["git_url"], aur_env)
                  if error:
                      print("::error::Could not re-read the current HEAD of " + label + " to check it is safe to restore (" + error + "). Check it by hand.")
                      errored.append(label)
                      continue
              else:
                  if not tap_env:
                      print("::error::GORELEASER_GITHUB_TOKEN is not set; cannot verify or restore " + label + ". Restore it by hand.")
                      errored.append(label)
                      continue
                  proc = subprocess.run(
                      ["gh", "api", "repos/" + t["owner"] + "/" + t["name"] + "/branches/" + t["branch"], "--jq", ".commit.sha"],
                      capture_output=True, text=True, env=tap_env,
                  )
                  current_sha = proc.stdout.strip()
                  if proc.returncode != 0 or not current_sha:
                      print("::error::Could not re-read the current HEAD of " + label + " to check it is safe to restore. Check it by hand.")
                      errored.append(label)
                      continue

              if current_sha != post_sha:
                  print("::error::Refusing to restore " + label + ": expected it to still be at the SHA GoReleaser just pushed (" + post_sha + "), but it is now at " + current_sha + ". Someone else has pushed to it since -- restoring would destroy that push. Reconcile it by hand; it currently points at unpublished/unverified content.")
                  refused.append(label + " (expected " + post_sha + ", found " + current_sha + ")")
                  continue

              if kind == "aur":
                  error = aur_force_push(t["git_url"], t["branch"], pre_sha, aur_env)
                  if error:
                      print("::error::Failed to restore " + label + " to its pre-release SHA " + pre_sha + " (" + error + ").")
                      errored.append(label)
                      continue
              else:
                  proc = subprocess.run(
                      [
                          "gh", "api", "-X", "PATCH",
                          "repos/" + t["owner"] + "/" + t["name"] + "/git/refs/heads/" + t["branch"],
                          "-f", "sha=" + pre_sha,
                          "-F", "force=true",
                      ],
                      capture_output=True, text=True, env=tap_env,
                  )
                  if proc.returncode != 0:
                      print("::error::Failed to restore " + label + " to its pre-release SHA " + pre_sha + ": " + proc.stderr.strip())
                      errored.append(label)
                      continue

              print("Restored " + label + " to its pre-release SHA " + pre_sha + ".")
              restored.append(label)

          # Delete the unpromoted draft release regardless of publisher
          # rollback outcome, so a later re-run is never blocked by an
          # existing (draft) release for the same tag and no orphan drafts
          # accumulate. Left as a warning-only no-op if this fails -- an
          # orphan draft is a cheap, purely cosmetic leftover compared to a
          # live formula pointing at unpublished content.
          tag = os.environ.get("TAG", "")
          release_env = dict(os.environ)
          release_env["GH_TOKEN"] = os.environ.get("RELEASE_GH_TOKEN", "")
          if tag:
              proc = subprocess.run(
                  ["gh", "release", "delete", tag, "--repo", os.environ.get("REPO", ""), "--yes"],
                  capture_output=True, text=True, env=release_env,
              )
              if proc.returncode == 0:
                  print("Deleted the unpromoted draft release " + tag + ".")
              else:
                  print("::warning::Could not delete the unpromoted draft release " + tag + ": " + proc.stderr.strip() + ". A human should delete it by hand so it does not linger as an orphan draft.")
          else:
              print("::warning::No tag resolved for this run; could not attempt to delete an unpromoted draft release.")

          print("Rollback summary: " + str(len(restored)) + " restored, " + str(len(refused)) + " refused (concurrent push), " + str(len(errored)) + " errored.")
          if restored:
              print("  restored: " + ", ".join(restored))
          if refused:
              print("::error::" + str(len(refused)) + " publisher repo(s) were NOT restored because of a concurrent push since GoReleaser's push: " + "; ".join(refused))
          if errored:
              print("::error::" + str(len(errored)) + " publisher repo(s) could not be checked or restored: " + "; ".join(errored))

          # Never mask the original verification failure above (this step's
          # own outcome does not change the job's already-failed
          # conclusion), but do exit non-zero when something here itself
          # needs a human's attention, so this step is visibly red too.
          if refused or errored:
              sys.exit(1)
          PYEOF
          python3 "${RUNNER_TEMP}/rollback.py"

  # Recomputes this workflow's public `tag` output (see on.workflow_call.
  # outputs.tag above) so a consumer's own downstream jobs -- e.g.
  # ingitdb-cli's Chocolatey/Snapcraft publisher jobs, which fire on
  # `needs.<this-workflow-job>.outputs.tag != ''` -- never see a non-empty
  # tag until the release is genuinely public. Needed because `release`
  # below now creates the tag and (when require_notarized_macos) a DRAFT
  # release unconditionally, before macos_verify_and_promote has run --
  # unlike the removed macos_signing_preflight, which gated `release`
  # itself, so a failed preflight meant `release` never ran and its tag
  # output was simply never set. Runs unconditionally (`if: always()`) so
  # it always produces a value, including when macos_verify_and_promote
  # never runs at all (require_notarized_macos: false, its normal
  # 'skipped' result), in which case release's own tag passes through
  # unchanged -- identical to today's behaviour for that (currently
  # default, though no live consumer uses it) case.
  finalize_release:
    name: Finalize release tag output
    needs: [ release, macos_verify_and_promote ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.finalize.outputs.tag }}
    steps:
      - name: Compute the publicly-released tag
        id: finalize
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          REQUIRE_NOTARIZED: ${{ inputs.require_notarized_macos }}
          VERIFY_RESULT: ${{ needs.macos_verify_and_promote.result }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [ "$REQUIRE_NOTARIZED" = "true" ] && [ "$VERIFY_RESULT" != "success" ]; then
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Resolves what layers 1-3 below need to know about THIS repo's own
  # release: the tag that was just published, the binary name (read from the
  # repo's own GoReleaser config, not guessed blind), and whether it
  # publishes a Homebrew cask (for layer 3). Runs once on ubuntu-latest —
  # where `yq` is guaranteed present — so the per-platform jobs below don't
  # each repeat this checkout/parse.
  #
  # Also waits on macos_verify_and_promote (a no-op dependency when
  # require_notarized_macos is false — that job doesn't run, so its result
  # is 'skipped' and the check below passes straight through): these are
  # POST-PUBLISH checks against the real public release, and when
  # require_notarized_macos is true the release is not actually public
  # until that job promotes it. Downloading and testing a still-draft (or
  # promotion-failed) release here would test something no real user can
  # reach yet.
  resolve_artifact_smoke_test:
    name: Resolve artifact smoke test target
    needs: [ release, macos_verify_and_promote ]
    if: >-
      ${{ inputs.artifact_smoke_test && !failure() && !cancelled() &&
          (needs.release.outputs.tag != '' || github.ref_type == 'tag') &&
          (needs.macos_verify_and_promote.result == 'success' || needs.macos_verify_and_promote.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      binary: ${{ steps.resolve.outputs.binary }}
      # false only for the specific case where we deliberately refuse to
      # guess (see the tag_prefix branch in "Resolve binary name" below).
      # Downstream jobs skip entirely rather than test/fail on a guess.
      binary_resolved: ${{ steps.resolve.outputs.binary_resolved }}
      has_homebrew_cask: ${{ steps.resolve.outputs.has_homebrew_cask }}
      homebrew_tap: ${{ steps.resolve.outputs.homebrew_tap }}
      homebrew_cask_name: ${{ steps.resolve.outputs.homebrew_cask_name }}

    steps:
      - name: Determine the tag this run published
        id: release_tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          [ -z "$tag" ] && tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Sparse, ref-pinned checkout: we only need the GoReleaser config as it
      # existed at the exact tag that was released, not the whole repo.
      - name: Checkout GoReleaser config at the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          sparse-checkout: |
            .goreleaser.yaml
            .goreleaser.yml
            goreleaser.yaml
            goreleaser.yml
          sparse-checkout-cone-mode: false

      - name: Resolve binary name and Homebrew cask target
        id: resolve
        env:
          BINARY_OVERRIDE: ${{ inputs.artifact_smoke_test_binary }}
          TAG: ${{ steps.release_tag.outputs.tag }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          config_file=""
          for f in .goreleaser.yaml .goreleaser.yml goreleaser.yaml goreleaser.yml; do
            if [ -f "$f" ]; then config_file="$f"; break; fi
          done

          binary="$BINARY_OVERRIDE"
          has_cask="false"
          tap=""
          cask_name=""
          binary_resolved="true"
          resolve_note=""

          if [ -n "$config_file" ] && command -v yq >/dev/null 2>&1; then
            if [ -z "$binary" ]; then
              binary="$(yq -r '.builds[0].binary // ""' "$config_file")"
              [ "$binary" = "null" ] && binary=""
              if [ -z "$binary" ]; then
                binary="$(yq -r '.project_name // ""' "$config_file")"
                [ "$binary" = "null" ] && binary=""
              fi
            fi
            cask_count="$(yq -r '.homebrew_casks // [] | length' "$config_file")"
            if [ -n "$cask_count" ] && [ "$cask_count" -gt 0 ]; then
              cask_name="$(yq -r '.homebrew_casks[0].name // ""' "$config_file")"
              tap_owner="$(yq -r '.homebrew_casks[0].repository.owner // ""' "$config_file")"
              tap_repo="$(yq -r '.homebrew_casks[0].repository.name // ""' "$config_file")"
              [ "$cask_name" = "null" ] && cask_name=""
              [ "$tap_owner" = "null" ] && tap_owner=""
              [ "$tap_repo" = "null" ] && tap_repo=""
              if [ -n "$tap_owner" ] && [ -n "$tap_repo" ] && [ -n "$cask_name" ]; then
                has_cask="true"
                tap="${tap_owner}/${tap_repo}"
              fi
            fi
          fi

          # Fallback inference when the config can't be read (or has no
          # explicit binary/project_name): repo name with a trailing "-cli"
          # stripped (specscore-cli -> specscore), or the org name for a repo
          # literally named "cli" (chatwright/cli -> chatwright). Homebrew
          # cask detection has no such fallback — it's config-only, since
          # there's nothing sensible to guess.
          #
          # EXCEPTION: if tag_prefix looks like a subdirectory-module path
          # (e.g. "ingitdb/v", documented above for the CD bump path) and no
          # root-level config was found, the repo-name guess is very likely
          # wrong for a subdirectory module -- the module has its own name,
          # not the repo's. Refuse to guess: leave binary unresolved. This is
          # "could not test", not "tested and broken" -- downstream jobs
          # skip entirely (see binary_resolved in job outputs) rather than
          # test, or hard-fail on, a binary name that was never verified
          # against reality. (Checked against every current consumer of this
          # workflow at the time this was written: none combine a
          # subdirectory tag_prefix with this fallback, but the workflow is
          # reused by repos not enumerated here, so this stays defensive.)
          if [ -z "$binary" ]; then
            case "$TAG_PREFIX" in
              */*)
                binary_resolved="false"
                resolve_note="Could not resolve a binary name to smoke test: tag_prefix '$TAG_PREFIX' looks like a subdirectory-module path, but no .goreleaser.yaml/.goreleaser.yml/goreleaser.yaml/goreleaser.yml was found at the REPO ROOT at tag $TAG. Guessing from the repo name would likely name the wrong module. Skipping the artifact smoke test for this release rather than testing (or failing on) an unverified guess. Set artifact_smoke_test_binary explicitly to enable it."
                ;;
              *)
                repo_name="${GITHUB_REPOSITORY#*/}"
                org_name="${GITHUB_REPOSITORY%%/*}"
                if [ "$repo_name" = "cli" ]; then
                  binary="$org_name"
                else
                  binary="${repo_name%-cli}"
                fi
                ;;
            esac
          fi

          if [ "$binary_resolved" = "false" ]; then
            echo "::warning::$resolve_note"
          fi

          echo "Resolved: tag=$TAG binary=$binary binary_resolved=$binary_resolved has_homebrew_cask=$has_cask homebrew_tap=$tap homebrew_cask_name=$cask_name"
          {
            echo "tag=$TAG"
            echo "binary=$binary"
            echo "binary_resolved=$binary_resolved"
            echo "has_homebrew_cask=$has_cask"
            echo "homebrew_tap=$tap"
            echo "homebrew_cask_name=$cask_name"
          } >> "$GITHUB_OUTPUT"

  # LAYERS 1 (always hard-fail) and 2 (macOS only; severity gated by
  # require_notarized_macos). Downloads the PUBLISHED release asset per
  # platform in artifact_smoke_test_platforms — never rebuilds from source,
  # which would reproduce the exact blind spot that let specscore-cli
  # v0.24.0 ship broken while CI stayed green (CI only ever tested source,
  # never what got uploaded).
  #
  # TAXONOMY, applied throughout this job and the Homebrew-cask job below:
  # "could not test" (no matching asset, no recognizable archive, no binary
  # found inside it, brew install itself failed) is NOT the same claim as
  # "tested and broken" (the binary was found, executed, and hung / exited
  # non-zero / printed nothing). Only the second justifies failing a
  # release — this workflow is consumed by repos not enumerated here,
  # including libraries and Docker-only releases with no per-arch archive,
  # and a naming/shape mismatch is not evidence the release is broken.
  # "Could not test" always logs ::warning:: and skips (exit 0); "tested and
  # broken" always hard-fails (exit 1), unconditionally for layer 1.
  artifact_smoke_test:
    name: 'Smoke test published artifact (${{ matrix.goos }}/${{ matrix.goarch }})'
    needs: [ release, resolve_artifact_smoke_test ]
    if: >-
      ${{ needs.resolve_artifact_smoke_test.result == 'success' &&
          needs.resolve_artifact_smoke_test.outputs.binary_resolved != 'false' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.artifact_smoke_test_platforms) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve_artifact_smoke_test.outputs.tag }}
      BINARY: ${{ needs.resolve_artifact_smoke_test.outputs.binary }}
      SMOKE_CMD: ${{ inputs.artifact_smoke_test_command }}
      TIMEOUT_SECONDS: ${{ inputs.artifact_smoke_test_timeout_seconds }}
      REQUIRE_NOTARIZED: ${{ inputs.require_notarized_macos }}

    steps:
      # Selects only real archives ("*_<goos>_<goarch>.{tar.gz,tgz,zip}"),
      # never a sidecar that happens to share the os/arch-suffixed name
      # (checksums, cosign .sig, SBOMs, .intoto.jsonl provenance) — those
      # don't get downloaded at all now, rather than relying on picking the
      # right file out of a mixed download afterward (see the Extract step;
      # this is finding 4 from review: nondeterministic `find` order over an
      # unfiltered download could previously select a sidecar instead of the
      # archive and flap between pass/fail across identical releases).
      #
      # No matching asset is NOT evidence of a broken release — see the
      # taxonomy note on the job above — so a miss here warns and skips
      # (asset_found=false) rather than failing. Wrapped in an explicit
      # timeout (network step; GitHub Actions' default job timeout is 6
      # hours, which the watchdog below exists specifically to avoid ever
      # relying on).
      - name: Download published release asset
        id: download
        shell: bash
        run: |
          set -uo pipefail
          set +e

          # Duplicated in this job's brew-install step and both "run the
          # binary" steps below (and in the Homebrew-cask job) — GitHub
          # Actions has no mechanism to share a bash function across steps
          # within one workflow file, so each step that needs a watchdog
          # redefines it.
          run_with_timeout() {
            local seconds="$1"; shift
            process_group_exists() {
              python3 -c 'import os, sys; os.killpg(int(sys.argv[1]), 0)' "$1" 2>/dev/null
            }
            # Job control puts the command in its own process group. That lets
            # the watchdog terminate forked descendants as well as its parent
            # on both the Ubuntu and macOS hosted runners.
            set -m
            "$@" &
            local cmd_pid=$!
            set +m
            # Use a single watchdog process rather than a shell plus a child
            # `sleep`: stopping and waiting for this PID cannot orphan a sleep
            # that keeps a command substitution open after the command exits.
            python3 -c '
          import os
          import signal
          import sys
          import time

          seconds = float(sys.argv[1])
          pgid = int(sys.argv[2])
          marker = sys.argv[3]
          time.sleep(seconds)
          try:
              os.killpg(pgid, 0)
          except ProcessLookupError:
              sys.exit(0)
          open(marker, "a").close()
          os.killpg(pgid, signal.SIGTERM)
          time.sleep(2)
          try:
              os.killpg(pgid, signal.SIGKILL)
          except ProcessLookupError:
              pass
          ' "$seconds" "$cmd_pid" "${RUNNER_TEMP}/.download_timed_out" >/dev/null 2>&1 &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            # A command can exit cleanly after forking a child. Do not return
            # while that child still owns this command's process group; keep
            # the leader's status and output, but terminate/reap descendants.
            if process_group_exists "$cmd_pid"; then
              kill -TERM -- "-$cmd_pid" 2>/dev/null
              local deadline=$((SECONDS + 2))
              while process_group_exists "$cmd_pid" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.05
              done
              if process_group_exists "$cmd_pid"; then
                kill -KILL -- "-$cmd_pid" 2>/dev/null
                local kill_deadline=$((SECONDS + 2))
                while process_group_exists "$cmd_pid" && [ "$SECONDS" -lt "$kill_deadline" ]; do
                  sleep 0.05
                done
              fi
            fi
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }

          mkdir -p "${RUNNER_TEMP}/artifact-smoke"
          rm -f "${RUNNER_TEMP}/.download_timed_out"
          goos="${{ matrix.goos }}"
          goarch="${{ matrix.goarch }}"
          echo "Downloading a ${goos}/${goarch} archive from $GITHUB_REPOSITORY@$TAG (timeout 120s)"
          run_with_timeout 120 gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*_${goos}_${goarch}.tar.gz" \
            --pattern "*_${goos}_${goarch}.tgz" \
            --pattern "*_${goos}_${goarch}.zip" \
            --dir "${RUNNER_TEMP}/artifact-smoke" --clobber
          status=$?

          if [ -f "${RUNNER_TEMP}/.download_timed_out" ]; then
            echo "::warning::Could not test ${goos}/${goarch}: 'gh release download' did not finish within 120s and was killed (network slowness or a GitHub API issue this run). This is NOT evidence the release is broken."
            echo "asset_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not test ${goos}/${goarch}: no release asset matched '*_${goos}_${goarch}.{tar.gz,tgz,zip}' for tag $TAG. This is NOT evidence the release is broken -- it means this platform isn't testable by this check as configured. Common legitimate reasons: this release doesn't publish ${goos}/${goarch} at all (a library, a Docker-only release, a universal macOS binary with no arch suffix), or its archive naming differs from GoReleaser's default '<name>_<version>_<os>_<arch>' convention (e.g. a custom archives.name_template). If ${goos}/${goarch} SHOULD be testable, fix the naming; otherwise trim artifact_smoke_test_platforms, or set artifact_smoke_test: false if this repo doesn't publish a runnable CLI binary at all."
            echo "asset_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ls -la "${RUNNER_TEMP}/artifact-smoke"
          echo "asset_found=true" >> "$GITHUB_OUTPUT"

      - name: Extract published archive
        id: extract
        if: ${{ steps.download.outputs.asset_found == 'true' }}
        shell: bash
        working-directory: ${{ runner.temp }}/artifact-smoke
        run: |
          set -uo pipefail
          set +e
          archive="$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) | head -n1)"
          if [ -z "$archive" ]; then
            echo "::warning::Could not test ${{ matrix.goos }}/${{ matrix.goarch }}: the download matched a release asset by name but none of them was a recognizable archive (.tar.gz/.tgz/.zip) once filtered — only non-archive sidecars (checksums, signatures, SBOMs) may have matched. This is NOT evidence the release is broken."
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Testing artifact: $archive"
          extract_ok=true
          case "$archive" in
            *.zip) unzip -o -q "$archive" || extract_ok=false ;;
            *.tar.gz|*.tgz) tar xzf "$archive" || extract_ok=false ;;
          esac
          if [ "$extract_ok" = false ]; then
            echo "::warning::Could not test ${{ matrix.goos }}/${{ matrix.goarch }}: failed to extract '$archive'. This is NOT evidence the release is broken -- the archive may be malformed, or built in a way this check's extraction logic doesn't handle."
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bin_path=""
          if [ -n "$BINARY" ] && [ -f "$BINARY" ]; then
            bin_path="$BINARY"
          elif [ -n "$BINARY" ]; then
            bin_path="$(find . -maxdepth 3 -type f -name "$BINARY" | head -n1)"
          fi
          if [ -z "$bin_path" ] || [ ! -f "$bin_path" ]; then
            if [ -z "$BINARY" ]; then
              echo "::warning::Could not test ${{ matrix.goos }}/${{ matrix.goarch }}: no binary name was resolved for this repo (see the 'Resolve artifact smoke test target' job above), so this check doesn't know what to look for inside '$archive'. Set artifact_smoke_test_binary explicitly."
            else
              echo "::warning::Could not test ${{ matrix.goos }}/${{ matrix.goarch }}: extracted '$archive' but found no '$BINARY' executable inside it. This is NOT evidence the release is broken -- this repo may build more than one binary (inference only checks the first 'builds[]' entry), or use a build id/binary name that differs from project_name. Set artifact_smoke_test_binary if this persists."
            fi
            echo "extracted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `find` may return a bare filename (e.g. "specscore"), which Bash
          # only looks up on PATH when invoked later. Publish an absolute path
          # so the following step executes the artifact we just extracted.
          bin_path="$(cd "$(dirname "$bin_path")" && pwd -P)/$(basename "$bin_path")"
          chmod +x "$bin_path"
          {
            echo "archive=$archive"
            echo "bin_path=$bin_path"
            echo "extracted=true"
          } >> "$GITHUB_OUTPUT"

      # LAYER 1 — download-and-run of the raw release asset. Once the binary
      # was actually found and executed, this is always a hard failure (it
      # passes today; a binary that won't even run standalone is
      # unambiguously broken) regardless of require_notarized_macos — this
      # is "tested and broken", the one case the taxonomy above always
      # fails. Proves the artifact itself is a working binary. It does NOT
      # prove a Homebrew-cask user can run it — that's layer 3 below. Runs
      # first: it's cheap, platform-agnostic, and unconditional, so a
      # genuinely broken binary fails fast before the macOS-only layer 2
      # check below. Skipped (not run at all) when extraction couldn't find
      # a binary to test — see the Extract step's "could not test" branches.
      - name: 'Layer 1: run the published binary (must exit within timeout)'
        if: ${{ steps.extract.outputs.extracted == 'true' }}
        shell: bash
        working-directory: ${{ runner.temp }}/artifact-smoke
        env:
          BIN_PATH: ${{ steps.extract.outputs.bin_path }}
        run: |
          # GitHub Actions runs `shell: bash` steps as `bash -e {0}` by
          # default regardless of what this script sets — `set -uo pipefail`
          # alone does NOT turn errexit off. Without an explicit `set +e`
          # here, `output="$(run_with_timeout ...)"` would abort the whole
          # step the instant the wrapped command returns non-zero, before
          # any of the diagnostics below ever run. (Caught by actually
          # running this on a GitHub-hosted runner against a failing
          # command — see PR description.)
          set -uo pipefail
          set +e

          run_with_timeout() {
            local seconds="$1"; shift
            process_group_exists() {
              python3 -c 'import os, sys; os.killpg(int(sys.argv[1]), 0)' "$1" 2>/dev/null
            }
            set -m
            "$@" &
            local cmd_pid=$!
            set +m
            python3 -c '
          import os
          import signal
          import sys
          import time

          seconds = float(sys.argv[1])
          pgid = int(sys.argv[2])
          marker = sys.argv[3]
          time.sleep(seconds)
          try:
              os.killpg(pgid, 0)
          except ProcessLookupError:
              sys.exit(0)
          open(marker, "a").close()
          os.killpg(pgid, signal.SIGTERM)
          time.sleep(2)
          try:
              os.killpg(pgid, signal.SIGKILL)
          except ProcessLookupError:
              pass
          ' "$seconds" "$cmd_pid" .smoke_timed_out >/dev/null 2>&1 &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            if process_group_exists "$cmd_pid"; then
              kill -TERM -- "-$cmd_pid" 2>/dev/null
              local deadline=$((SECONDS + 2))
              while process_group_exists "$cmd_pid" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.05
              done
              if process_group_exists "$cmd_pid"; then
                kill -KILL -- "-$cmd_pid" 2>/dev/null
                local kill_deadline=$((SECONDS + 2))
                while process_group_exists "$cmd_pid" && [ "$SECONDS" -lt "$kill_deadline" ]; do
                  sleep 0.05
                done
              fi
            fi
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }

          rm -f .smoke_timed_out
          echo "Running: $BIN_PATH $SMOKE_CMD   (must exit within ${TIMEOUT_SECONDS}s)"
          # SMOKE_CMD is deliberately unquoted: it's a space-separated
          # argument list (e.g. '--version'), split into words the same way
          # ${{ inputs.goreleaser_extra_args }} is elsewhere in this file.
          # shellcheck disable=SC2086
          output="$(run_with_timeout "$TIMEOUT_SECONDS" "$BIN_PATH" $SMOKE_CMD 2>&1)"
          status=$?

          echo "----- output -----"
          printf '%s\n' "$output"
          echo "-------------------"

          if [ -f .smoke_timed_out ]; then
            echo "::error::Published artifact for ${{ matrix.goos }}/${{ matrix.goarch }} HUNG: '$BIN_PATH $SMOKE_CMD' did not exit within ${TIMEOUT_SECONDS}s and was killed. A published binary that hangs on every invocation is unambiguously broken — this is a hard failure regardless of require_notarized_macos."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            if [ "${{ matrix.goos }}" = "darwin" ] && command -v codesign >/dev/null 2>&1; then
              signature_output="$(codesign --verify --deep --strict --verbose=4 "$BIN_PATH" 2>&1)"
              signature_status=$?
              echo "----- macOS code-signature verification -----"
              printf '%s\n' "$signature_output"
              echo "----------------------------------------------"
              if [ "$signature_status" -ne 0 ]; then
                echo "::error::Published darwin/${{ matrix.goarch }} artifact has an invalid macOS code signature (codesign --verify --deep --strict exited $signature_status). macOS may kill it with SIGKILL/137 before the program can print diagnostics. Re-sign the artifact from a clean Mach-O linker output before publishing."
              fi
            fi
            echo "::error::Published artifact for ${{ matrix.goos }}/${{ matrix.goarch }} exited $status running '$BIN_PATH $SMOKE_CMD'."
            exit 1
          fi
          if [ -z "$(printf '%s' "$output" | tr -d '[:space:]')" ]; then
            echo "::error::Published artifact for ${{ matrix.goos }}/${{ matrix.goarch }} exited 0 but printed no output running '$BIN_PATH $SMOKE_CMD'."
            exit 1
          fi
          echo "OK: published ${{ matrix.goos }}/${{ matrix.goarch }} artifact runs standalone and exits 0 with output. (This does not prove a Homebrew-cask install of it works for a user — see layer 2/3.)"

      # LAYER 2 — macOS only. Static inspection; never executes the binary,
      # so this check itself carries no quarantine/Gatekeeper risk. This is
      # what actually would have caught specscore-cli v0.24.0: layer 1 above
      # PASSES for that release, because a plain download carries no
      # com.apple.quarantine attribute — only the Homebrew-cask install path
      # applies one (layer 3). An ad-hoc-signed, unnotarized binary runs
      # fine until quarantined; the moment it is, Gatekeeper blocks it
      # outright. Verified directly against the published v0.24.0 darwin
      # binary: `codesign -dv` showed Identifier=a.out, TeamIdentifier=not
      # set — genuinely ad-hoc signed, independently damning on its own.
      #
      # `spctl -a -vv` (no `-t`, which defaults to type `execute`) also
      # returned "rejected" for that v0.24.0 binary, but that specific
      # reading is CONFOUNDED and must not be trusted on its own: measured
      # directly against the real, published, Developer-ID-signed and
      # notarized `ingitdb/ingitdb-cli` v0.65.10 darwin/arm64 binary on
      # macOS 15, both `spctl -a -vv` and `spctl -a -vv -t exec` REJECT it
      # too (exit 3, "the code is valid but does not seem to be an app") —
      # a bare Mach-O CLI binary is never an app bundle, so the
      # default/`exec` assessment type rejects one regardless of signing or
      # notarization state. `spctl -a -vv -t install` is the assessment type
      # that returns Apple's real verdict for this artifact shape: it
      # ACCEPTED that same notarized binary (exit 0) with
      # `source=Notarized Developer ID` in its output — the string that
      # actually proves notarization. That is the call this step uses below.
      # Exit code 0 alone is still not sufficient: a Developer-ID-signed but
      # never-notarized binary can also pass `-t install` with exit 0, so
      # the step additionally greps the output for
      # `source=Notarized Developer ID`.
      - name: 'Layer 2: assert macOS code signing / notarization'
        if: ${{ matrix.goos == 'darwin' && steps.extract.outputs.extracted == 'true' }}
        shell: bash
        working-directory: ${{ runner.temp }}/artifact-smoke
        env:
          BIN_PATH: ${{ steps.extract.outputs.bin_path }}
        run: |
          # See the "Layer 1" step above: GitHub Actions' default bash
          # invocation is `bash -e {0}`, so `set +e` is required here too or
          # `spctl_out="$(spctl ...)"` aborts the step the instant spctl
          # rejects the binary — before the warn-vs-fail branch below ever
          # runs.
          set -uo pipefail
          set +e
          echo "=== codesign -dv --verbose=4 ==="
          codesign_out="$(codesign -dv --verbose=4 "$BIN_PATH" 2>&1)"
          printf '%s\n' "$codesign_out"
          echo
          echo "=== spctl -a -vv -t install ==="
          spctl_out="$(spctl -a -vv -t install "$BIN_PATH" 2>&1)"
          spctl_status=$?
          printf '%s\n' "$spctl_out"

          team_id="$(printf '%s\n' "$codesign_out" | grep '^TeamIdentifier=' | cut -d'=' -f2-)"
          problems=""
          if [ -z "$team_id" ] || [ "$team_id" = "not set" ]; then
            problems="${problems}no Developer ID (TeamIdentifier: ${team_id:-not set}); "
          fi
          if [ "$spctl_status" -ne 0 ]; then
            problems="${problems}spctl rejected this binary (exit $spctl_status) — Gatekeeper will block it once quarantined; "
          elif ! printf '%s\n' "$spctl_out" | grep -q 'source=Notarized Developer ID'; then
            problems="${problems}spctl accepted the binary (exit 0) but it is not notarized — no 'source=Notarized Developer ID' in its output, meaning it was signed with a Developer ID but never submitted for/granted notarization; "
          fi

          if [ -z "$problems" ]; then
            echo "OK: ${{ matrix.goos }}/${{ matrix.goarch }} artifact is signed with a real Developer ID and is notarized (spctl -t install: source=Notarized Developer ID)."
            exit 0
          fi

          msg="Published macOS artifact is not properly signed/notarized: ${problems}To fix: get an Apple Developer ID Application certificate and App Store Connect API credentials, wire both into this release job as notarization secrets (see this repo's README, 'macOS notarization'), then set require_notarized_macos: true for this repo to enforce it going forward. Until fixed, a Homebrew-cask install of this CLI is blocked by Gatekeeper for real interactive users — an indefinite 'Apple could not verify' dialog with no way to proceed except manually approving it in System Settings. This is the exact specscore-cli v0.24.0 incident."
          if [ "$REQUIRE_NOTARIZED" = "true" ]; then
            echo "::error::$msg"
            exit 1
          else
            echo "::warning::$msg"
            exit 0
          fi

  # LAYER 3 — the path a real Homebrew user actually takes. Auto-detected
  # from this repo's own GoReleaser config via resolve_artifact_smoke_test;
  # no-ops for a repo that doesn't publish a Homebrew cask. `brew install
  # --cask` is the only layer that reproduces Homebrew's quarantine
  # attribute on the installed binary, which is what actually blocked
  # specscore-cli v0.24.0 — the raw release asset (layer 1) ran fine
  # standalone. Runs on macos-latest (Apple Silicon); Homebrew casks are
  # macOS-only in this org's convention. Severity follows
  # require_notarized_macos, same as layer 2 (same root cause: no CLI this
  # org publishes is notarized yet).
  #
  # KNOWN GAP (confirmed empirically, not assumed — see PR description for
  # the CI run): a GitHub-hosted macos-latest runner has no interactive
  # session, so it cannot reproduce the real, INDEFINITE "Apple could not
  # verify" Gatekeeper dialog a logged-in user hits. Run against the actual
  # quarantined, ad-hoc-signed specscore-cli v0.24.0 Homebrew-cask binary,
  # this job did not hang — it completed after a ~30s Gatekeeper assessment
  # delay and exited 0, right at the edge of the default timeout. Treat this
  # layer as corroborating; layer 2's static codesign/spctl assertion is the
  # reliable, deterministic signal on this runner type.
  artifact_smoke_test_homebrew_cask:
    name: 'Smoke test Homebrew cask install (darwin/arm64)'
    needs: [ release, resolve_artifact_smoke_test ]
    if: >-
      ${{ needs.resolve_artifact_smoke_test.result == 'success' &&
          needs.resolve_artifact_smoke_test.outputs.binary_resolved != 'false' &&
          inputs.artifact_smoke_test_homebrew_cask &&
          needs.resolve_artifact_smoke_test.outputs.has_homebrew_cask == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BINARY: ${{ needs.resolve_artifact_smoke_test.outputs.binary }}
      HOMEBREW_TAP: ${{ needs.resolve_artifact_smoke_test.outputs.homebrew_tap }}
      CASK_NAME: ${{ needs.resolve_artifact_smoke_test.outputs.homebrew_cask_name }}
      SMOKE_CMD: ${{ inputs.artifact_smoke_test_command }}
      TIMEOUT_SECONDS: ${{ inputs.artifact_smoke_test_timeout_seconds }}
      REQUIRE_NOTARIZED: ${{ inputs.require_notarized_macos }}

    steps:
      # A `brew tap`/`brew install --cask` failure here is "could not test"
      # (transient Homebrew/network issue, tap-visibility timing right
      # after GoReleaser pushed the cask manifest, or a name mismatch) — NOT
      # evidence the release is broken, so this warns and skips the rest of
      # this job rather than failing it unconditionally regardless of
      # require_notarized_macos, which is what it did before this review
      # (finding 3). Wrapped in an explicit timeout for the same reason as
      # the download step in the job above: no watchdog here meant a hang
      # was bounded only by GitHub's 6-hour default job timeout.
      - name: brew install --cask (the real user path)
        id: brew_install
        shell: bash
        run: |
          set -uo pipefail
          set +e

          run_with_timeout() {
            local seconds="$1"; shift
            process_group_exists() {
              python3 -c 'import os, sys; os.killpg(int(sys.argv[1]), 0)' "$1" 2>/dev/null
            }
            set -m
            "$@" &
            local cmd_pid=$!
            set +m
            python3 -c '
          import os
          import signal
          import sys
          import time

          seconds = float(sys.argv[1])
          pgid = int(sys.argv[2])
          marker = sys.argv[3]
          time.sleep(seconds)
          try:
              os.killpg(pgid, 0)
          except ProcessLookupError:
              sys.exit(0)
          open(marker, "a").close()
          os.killpg(pgid, signal.SIGTERM)
          time.sleep(2)
          try:
              os.killpg(pgid, signal.SIGKILL)
          except ProcessLookupError:
              pass
          ' "$seconds" "$cmd_pid" "${RUNNER_TEMP}/.brew_install_timed_out" >/dev/null 2>&1 &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            if process_group_exists "$cmd_pid"; then
              kill -TERM -- "-$cmd_pid" 2>/dev/null
              local deadline=$((SECONDS + 2))
              while process_group_exists "$cmd_pid" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.05
              done
              if process_group_exists "$cmd_pid"; then
                kill -KILL -- "-$cmd_pid" 2>/dev/null
                local kill_deadline=$((SECONDS + 2))
                while process_group_exists "$cmd_pid" && [ "$SECONDS" -lt "$kill_deadline" ]; do
                  sleep 0.05
                done
              fi
            fi
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }

          rm -f "${RUNNER_TEMP}/.brew_install_timed_out"
          echo "Tapping $HOMEBREW_TAP and installing --cask $HOMEBREW_TAP/$CASK_NAME (timeout 300s)"
          # Single-quoted on purpose: $HOMEBREW_TAP/$CASK_NAME must expand in
          # the inner `bash -c` shell (against its inherited environment),
          # not in this outer shell, so the timeout wraps both commands as
          # one unit.
          # shellcheck disable=SC2016
          run_with_timeout 300 bash -c 'set -e; brew tap "$HOMEBREW_TAP" && brew install --cask "$HOMEBREW_TAP/$CASK_NAME"'
          status=$?

          if [ -f "${RUNNER_TEMP}/.brew_install_timed_out" ]; then
            echo "::warning::Could not test the Homebrew-cask install path: 'brew tap'/'brew install --cask $HOMEBREW_TAP/$CASK_NAME' did not finish within 300s and was killed. This is NOT evidence the release is broken -- this check could not verify it this run (Homebrew/network slowness). Investigate separately if this recurs across releases."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not test the Homebrew-cask install path: 'brew tap $HOMEBREW_TAP' / 'brew install --cask $HOMEBREW_TAP/$CASK_NAME' exited $status (see the log above for the actual brew error). This is NOT evidence the release is broken. Common causes: a transient Homebrew/network issue, tap-visibility timing right after GoReleaser pushed the cask manifest, or a cask-name/tap mismatch (double check homebrew_casks[0].name / .repository in .goreleaser.yaml against '$CASK_NAME' / '$HOMEBREW_TAP' resolved here)."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "installed=true" >> "$GITHUB_OUTPUT"

      # Runs the binary Homebrew actually put on disk — quarantine
      # attribute and all. Uses the same portable timeout wrapper as layer
      # 1 (no reliance on GNU `timeout`/`gtimeout`, neither of which ships
      # on the stock macOS runner image). Skipped entirely when the install
      # step above couldn't verify anything.
      - name: 'Layer 3: run the Homebrew-installed binary (must exit within timeout)'
        if: ${{ steps.brew_install.outputs.installed == 'true' }}
        shell: bash
        run: |
          # See "Layer 1" above: GitHub Actions' default bash invocation is
          # `bash -e {0}`, so `set +e` is required here too or
          # `output="$(run_with_timeout ...)"` aborts the step the instant
          # the installed binary times out or exits non-zero — before the
          # warn-vs-fail branch below ever runs.
          set -uo pipefail
          set +e
          bin_path="$(brew --prefix)/bin/$BINARY"
          if [ ! -x "$bin_path" ]; then
            # "Could not test", not "tested and broken": brew reported a
            # successful install, so this is much more likely our binary
            # name guess being wrong than the cask actually being empty --
            # GoReleaser's homebrew_casks always emits a `binary` stanza
            # that Homebrew auto-symlinks, so a genuinely broken cask would
            # usually fail brew install itself, not silently install with no
            # symlink. Warn and skip rather than fail the release on an
            # unverified guess.
            echo "::warning::Could not test the Homebrew-cask install path: brew install --cask reported success, but '$bin_path' is not an executable. This is NOT evidence the release is broken -- most likely artifact_smoke_test_binary's resolved name ('$BINARY') doesn't match this cask's actual binary. Set artifact_smoke_test_binary explicitly if this persists."
            exit 0
          fi

          run_with_timeout() {
            local seconds="$1"; shift
            process_group_exists() {
              python3 -c 'import os, sys; os.killpg(int(sys.argv[1]), 0)' "$1" 2>/dev/null
            }
            set -m
            "$@" &
            local cmd_pid=$!
            set +m
            python3 -c '
          import os
          import signal
          import sys
          import time

          seconds = float(sys.argv[1])
          pgid = int(sys.argv[2])
          marker = sys.argv[3]
          time.sleep(seconds)
          try:
              os.killpg(pgid, 0)
          except ProcessLookupError:
              sys.exit(0)
          open(marker, "a").close()
          os.killpg(pgid, signal.SIGTERM)
          time.sleep(2)
          try:
              os.killpg(pgid, signal.SIGKILL)
          except ProcessLookupError:
              pass
          ' "$seconds" "$cmd_pid" "${RUNNER_TEMP}/.smoke_cask_timed_out" >/dev/null 2>&1 &
            local watchdog_pid=$!
            wait "$cmd_pid" 2>/dev/null
            local exit_code=$?
            if process_group_exists "$cmd_pid"; then
              kill -TERM -- "-$cmd_pid" 2>/dev/null
              local deadline=$((SECONDS + 2))
              while process_group_exists "$cmd_pid" && [ "$SECONDS" -lt "$deadline" ]; do
                sleep 0.05
              done
              if process_group_exists "$cmd_pid"; then
                kill -KILL -- "-$cmd_pid" 2>/dev/null
                local kill_deadline=$((SECONDS + 2))
                while process_group_exists "$cmd_pid" && [ "$SECONDS" -lt "$kill_deadline" ]; do
                  sleep 0.05
                done
              fi
            fi
            kill "$watchdog_pid" 2>/dev/null
            wait "$watchdog_pid" 2>/dev/null
            return "$exit_code"
          }

          rm -f "${RUNNER_TEMP}/.smoke_cask_timed_out"
          echo "Running: $bin_path $SMOKE_CMD   (must exit within ${TIMEOUT_SECONDS}s)"
          # SMOKE_CMD is deliberately unquoted; see the layer 1 step above.
          # shellcheck disable=SC2086
          output="$(run_with_timeout "$TIMEOUT_SECONDS" "$bin_path" $SMOKE_CMD 2>&1)"
          status=$?

          echo "----- output -----"
          printf '%s\n' "$output"
          echo "-------------------"

          problem=""
          if [ -f "${RUNNER_TEMP}/.smoke_cask_timed_out" ]; then
            problem="HUNG: '$bin_path $SMOKE_CMD' did not exit within ${TIMEOUT_SECONDS}s and was killed."
          elif [ "$status" -ne 0 ]; then
            problem="exited $status."
          elif [ -z "$(printf '%s' "$output" | tr -d '[:space:]')" ]; then
            problem="exited 0 but printed no output."
          fi

          if [ -z "$problem" ]; then
            # KNOWN GAP, confirmed empirically against the actual
            # specscore-cli v0.24.0 artifact on a real GitHub-hosted
            # macos-latest runner: this step passing does NOT prove real
            # users can run this binary. A GitHub Actions runner has no
            # interactive session, so the real, indefinite "Apple could not
            # verify" Gatekeeper dialog a logged-in user hits has nowhere to
            # render. The confirmed v0.24.0 binary, quarantined by this same
            # `brew install --cask` step, did not hang here — it completed
            # after a ~30s Gatekeeper assessment delay and ran successfully,
            # right at the edge of the default timeout. Layer 2 (the
            # codesign/spctl assertion above) is the reliable signal on this
            # runner type; treat this layer as corroborating, not
            # authoritative.
            echo "OK: the Homebrew-cask-installed binary ran and exited 0 with output. NOTE: a headless GitHub Actions runner has no session to render Gatekeeper's dialog, so this does not prove an interactive user isn't blocked -- rely on the layer 2 signing assertion above for that guarantee."
            exit 0
          fi

          msg="Homebrew-cask-installed binary $problem This is the exact specscore-cli v0.24.0 failure mode: the raw release asset runs fine (layer 1 passed), but the copy 'brew install --cask' puts on disk is quarantined, and Gatekeeper blocks an ad-hoc-signed, unnotarized binary the moment it is quarantined — a real user sees an indefinite 'Apple could not verify' dialog. See the layer 2 signing diagnostics above for exactly what's missing. Fix: notarize this CLI's macOS build (Developer ID cert + App Store Connect API credentials), then set require_notarized_macos: true to enforce this going forward."
          if [ "$REQUIRE_NOTARIZED" = "true" ]; then
            echo "::error::$msg"
            exit 1
          else
            echo "::warning::$msg"
            exit 0
          fi
